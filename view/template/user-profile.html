<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户资料</title>
</head>
<body>
  <style>
    .profile-container {
      display: flex;
      gap: 20px;
      height: calc(100vh - 180px);
    }

    .profile-sidebar {
      width: 240px;
      flex-shrink: 0;
      overflow-y: auto;
    }

    .profile-avatar-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 30px 20px 10px 20px;
      text-align: center;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .profile-avatar-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 16px;
      cursor: pointer;
      border-radius: 50%;
      overflow: hidden;
    }

    .profile-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 36px;
      font-weight: 600;
    }

    .profile-avatar-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .profile-avatar-wrapper:hover .profile-avatar-overlay {
      opacity: 1;
    }

    .profile-avatar-overlay i {
      font-size: 20px;
      margin-bottom: 4px;
    }

    .profile-avatar-overlay span {
      font-size: 12px;
    }

    .profile-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: break-all;
    }

    .profile-role-tag {
      display: inline-block;
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 10px;
      background: var(--accent-light);
      color: var(--accent);
      margin-bottom: 8px;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: bottom;
    }

    .profile-role {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-menu {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .profile-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
      border-left: 3px solid transparent;
    }

    .profile-menu-item:hover {
      background: var(--bg-content);
      color: var(--text-primary);
    }

    .profile-menu-item.active {
      background: var(--accent-light);
      color: var(--accent);
      border-left-color: var(--accent);
    }

    .profile-menu-item i {
      font-size: 18px;
    }

    .profile-main {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
    }

    .profile-panel {
      display: none;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .profile-panel.active {
      display: block;
    }

    .profile-panel-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }

    .profile-panel-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .profile-panel-desc {
      font-size: 13px;
      color: var(--text-muted);
    }

    .profile-panel-body {
      padding: 24px;
    }

    .profile-form {
      max-width: 500px;
    }

    .profile-form .layui-form-label {
      width: 90px;
    }

    .profile-form .layui-input-block {
      margin-left: 120px;
    }

    .input-with-btn {
      display: flex;
      gap: 10px;
    }

    .input-with-btn .layui-input {
      flex: 1;
    }

    .input-with-btn .layui-btn {
      white-space: nowrap;
    }

    .bind-divider {
      display: flex;
      align-items: center;
      margin: 30px 0 20px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .bind-divider::before,
    .bind-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .bind-divider span {
      padding: 0 16px;
    }

    .third-party-bind {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bind-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background: var(--bg-content);
      border-radius: 8px;
    }

    .bind-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 2px solid var(--border);
      background: var(--card-bg);
      overflow: hidden;
      padding: 0;
      transition: all 0.25s;
    }

    .bind-icon:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(14, 165, 233, 0.12);
    }

    .bind-icon svg {
      width: 20px;
      height: 20px;
    }

    .bind-info {
      flex: 1;
    }

    .bind-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .bind-status {
      font-size: 12px;
      color: var(--text-muted);
    }

    .bind-status.bound {
      color: var(--accent);
    }

    @media (max-width: 768px) {
      .profile-container {
        flex-direction: column;
      }
      
      .profile-sidebar {
        width: 100%;
      }
      
      .profile-form .layui-form-label {
        width: 80px;
      }
      
      .profile-form .layui-input-block {
        margin-left: 110px;
      }
    }
  </style>

  <div class="page-content">
    <div class="profile-container">
      <div class="profile-sidebar">
        <div class="profile-avatar-card">
          <div class="profile-avatar-wrapper">
            <img src="" alt="用户头像" id="avatarPreview" class="profile-avatar-img">
            <div class="profile-avatar-overlay">
              <i class="layui-icon layui-icon-upload"></i>
              <span>更换头像</span>
            </div>
          </div>
          <div class="profile-name" id="profileName">超级管理员</div>
          <div class="profile-role" id="profileRole">admin</div>
          <div class="profile-role-tag" id="profileRoleTag">超级管理员</div>
        </div>
        
        <div class="profile-menu">
          <div class="profile-menu-item active" data-tab="basic">
            <i class="layui-icon layui-icon-user"></i>
            <span>基本信息</span>
          </div>
          <div class="profile-menu-item" data-tab="security">
            <i class="layui-icon layui-icon-password"></i>
            <span>安全设置</span>
          </div>
          <div class="profile-menu-item" data-tab="bindinfo">
            <i class="layui-icon layui-icon-cellphone"></i>
            <span>绑定信息</span>
          </div>
        </div>
      </div>
      
      <div class="profile-main">
        <div class="profile-panel active" id="panelBasic">
          <div class="profile-panel-header">
            <h3 class="profile-panel-title">基本信息</h3>
            <p class="profile-panel-desc">修改个人基本信息，保存后立即生效</p>
          </div>
          <div class="profile-panel-body">
            <form class="layui-form profile-form" lay-filter="basicForm">
              <div class="layui-form-item">
                <label class="layui-form-label">用户ID</label>
                <div class="layui-input-block">
                  <input type="text" name="id" id="userId" class="layui-input" disabled>
                </div>
              </div>
              <div class="layui-form-item">
                <label class="layui-form-label">用户名</label>
                <div class="layui-input-block">
                  <input type="text" name="username" id="userName" class="layui-input" disabled>
                </div>
              </div>
              <div class="layui-form-item">
                <label class="layui-form-label">昵称</label>
                <div class="layui-input-block">
                  <input type="text" name="nickname" id="userNickname" placeholder="请输入昵称" class="layui-input" lay-verify="required">
                </div>
              </div>
              <div class="layui-form-item">
                <label class="layui-form-label">角色</label>
                <div class="layui-input-block">
                  <input type="text" name="rolename" id="userRolename" class="layui-input" disabled>
                </div>
              </div>
              <div class="layui-form-item">
                <label class="layui-form-label">邮箱</label>
                <div class="layui-input-block">
                  <input type="email" name="email" id="userEmail" placeholder="请输入邮箱地址" class="layui-input" lay-verify="email">
                </div>
              </div>
              <div class="layui-form-item">
                <label class="layui-form-label">个人简介</label>
                <div class="layui-input-block">
                  <textarea name="bio" id="userBio" placeholder="介绍一下自己吧" class="layui-textarea"></textarea>
                </div>
              </div>
              <div class="layui-form-item">
                <div class="layui-input-block">
                  <button type="button" class="layui-btn" lay-submit lay-filter="saveBasic">保存修改</button>
                  <button type="reset" class="layui-btn layui-btn-primary">重置</button>
                </div>
              </div>
            </form>
          </div>
        </div>
        
        <div class="profile-panel" id="panelSecurity">
          <div class="profile-panel-header">
            <h3 class="profile-panel-title">安全设置</h3>
            <p class="profile-panel-desc">修改登录密码，确保账号安全</p>
          </div>
          <div class="profile-panel-body">
            <form class="layui-form profile-form" lay-filter="securityForm">
              <div class="layui-form-item">
                <label class="layui-form-label">当前密码</label>
                <div class="layui-input-block">
                  <input type="password" name="oldPassword" placeholder="请输入当前密码" class="layui-input" lay-verify="required">
                </div>
              </div>
              <div class="layui-form-item">
                <label class="layui-form-label">新密码</label>
                <div class="layui-input-block">
                  <input type="password" name="newPassword" placeholder="请输入新密码（6-20位）" class="layui-input" lay-verify="required|pass">
                </div>
              </div>
              <div class="layui-form-item">
                <label class="layui-form-label">确认密码</label>
                <div class="layui-input-block">
                  <input type="password" name="confirmPassword" placeholder="请再次输入新密码" class="layui-input" lay-verify="required|confirm">
                </div>
              </div>
              <div class="layui-form-item">
                <div class="layui-input-block">
                  <button type="button" class="layui-btn" lay-submit lay-filter="savePassword">修改密码</button>
                </div>
              </div>
            </form>
          </div>
        </div>
        
        <div class="profile-panel" id="panelBindinfo">
          <div class="profile-panel-header">
            <h3 class="profile-panel-title">绑定信息</h3>
            <p class="profile-panel-desc">绑定手机号和第三方账号</p>
          </div>
          <div class="profile-panel-body">
            <form class="layui-form profile-form" lay-filter="bindForm">
              <div class="layui-form-item">
                <label class="layui-form-label">手机号</label>
                <div class="layui-input-block">
                  <input type="text" name="mobile" id="userMobile" placeholder="请输入手机号" class="layui-input" lay-verify="phone">
                </div>
              </div>
              <div class="layui-form-item">
                <label class="layui-form-label">验证码</label>
                <div class="layui-input-block">
                  <div class="input-with-btn">
                    <input type="text" name="smsCode" placeholder="请输入验证码" class="layui-input">
                    <button type="button" class="layui-btn layui-btn-primary" id="sendSmsBtn">获取验证码</button>
                  </div>
                </div>
              </div>
              <div class="layui-form-item">
                <div class="layui-input-block">
                  <button type="button" class="layui-btn" lay-submit lay-filter="saveMobile">绑定手机</button>
                </div>
              </div>
            </form>
            
            <div class="bind-divider">
              <span>第三方账号绑定</span>
            </div>
            
            <div class="third-party-bind">
              <div class="bind-item">

                </div>
                <div class="bind-info">
                  <div class="bind-name">微信</div>
                  <div class="bind-status" id="wechatStatus">未绑定</div>
                </div>
                <button class="layui-btn layui-btn-sm layui-btn-primary" id="bindWechat">立即绑定</button>
              </div>
              <div class="bind-item">
                <div class="bind-icon">
                  <svg viewBox="0 0 24 24"><path d="M21.395 15.035a39.548 39.548 0 0 0-.803-2.264l-1.079-2.695c.001-.032.014-.562.014-.836C19.526 4.632 17.351 0 12 0S4.474 4.632 4.474 9.241c0 .274.013.804.014.836l-1.08 2.695a38.97 38.97 0 0 0-.802 2.264c-1.021 3.283-.69 4.643-.438 4.673.54.065 2.103-2.472 2.103-2.472 0 1.469.756 3.387 2.394 4.771-.612.188-1.363.479-1.845.835-.434.32-.379.646-.301.778.343.578 5.883.703 7.479.703 1.596 0 7.135-.125 7.478-.703.078-.132.132-.458-.301-.778-.481-.356-1.233-.646-1.845-.835 1.638-1.384 2.394-3.302 2.394-4.771 0 0 1.563 2.537 2.103 2.472.251-.03.581-1.39-.438-4.673z" fill="#12B7F5"/></svg>
                </div>
                <div class="bind-info">
                  <div class="bind-name">QQ</div>
                  <div class="bind-status" id="qqStatus">未绑定</div>
                </div>
                <button class="layui-btn layui-btn-sm layui-btn-primary" id="bindQq">立即绑定</button>
              </div>
              <div class="bind-item">
                <div class="bind-icon">
                  <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                </div>
                <div class="bind-info">
                  <div class="bind-name">Google</div>
                  <div class="bind-status" id="googleStatus">未绑定</div>
                </div>
                <button class="layui-btn layui-btn-sm layui-btn-primary" id="bindGoogle">立即绑定</button>
              </div>
              <div class="bind-item">
                <div class="bind-icon">
                  <svg viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" fill="#24292e"/></svg>
                </div>
                <div class="bind-info">
                  <div class="bind-name">GitHub</div>
                  <div class="bind-status" id="githubStatus">未绑定</div>
                </div>
                <button class="layui-btn layui-btn-sm layui-btn-primary" id="bindGithub">立即绑定</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    layui.use(['form', 'layer', 'upload'], function() {
      var form = layui.form;
      var layer = layui.layer;
      var upload = layui.upload;
      var $ = layui.$;

      var userData = null;

      function loadUserData() {
        var userinfoConfig = (window.OSLAY && window.OSLAY.appConfig && window.OSLAY.appConfig.userinfo) || {};
        var userinfoUrl = userinfoConfig.url || 'view/data/userinfo.json';
        
        $.ajax({
          url: userinfoUrl,
          dataType: 'json',
          cache: false
        }).done(function(response) {
          if (response && response.code === 0 && response.data) {
            userData = response.data;
            renderUserData(userData);
          }
        }).fail(function() {
          layer.msg('加载用户信息失败', { icon: 2 });
        });
      }

      function renderUserData(data) {
        if (!data) return;
        
        $('#profileName').text(data.nickname || '未设置昵称');
        $('#profileRole').text(data.username || 'user');
        $('#profileRoleTag').text(data.rolename || '普通用户');
        
        if (data.avatar) {
          $('#avatarPreview').attr('src', data.avatar);
        } else {
          var firstChar = (data.nickname || 'U').charAt(0);
          $('#avatarPreview').attr('src', 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="' + getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() + '" width="100" height="100"/><text x="50" y="50" dominant-baseline="central" text-anchor="middle" fill="#fff" font-size="40" font-weight="600">' + firstChar + '</text></svg>'));
        }
        
        $('#userId').val(data.id || '');
        $('#userName').val(data.username || '');
        $('#userNickname').val(data.nickname || '');
        $('#userRolename').val(data.rolename || '');
        $('#userEmail').val(data.email || '');
        $('#userMobile').val(data.mobile || '');
        
        form.render();
      }

      loadUserData();

      $('.profile-menu-item').on('click', function() {
        var tab = $(this).data('tab');
        $('.profile-menu-item').removeClass('active');
        $(this).addClass('active');
        
        $('.profile-panel').removeClass('active');
        $('#panel' + tab.charAt(0).toUpperCase() + tab.slice(1)).addClass('active');
      });

      upload.render({
        elem: '.profile-avatar-wrapper',
        url: '', // 后端上传接口
        auto: false,
        choose: function(obj) {
          obj.preview(function(index, file, result) {
            $('#avatarPreview').attr('src', result);
            layer.msg('头像已选择，请点击保存', { icon: 1 });
          });
        }
      });

      form.verify({
        pass: function(value) {
          if (value.length < 6 || value.length > 20) {
            return '密码长度必须为6-20位';
          }
        },
        confirm: function(value) {
          var newPass = $('input[name="newPassword"]').val();
          if (value !== newPass) {
            return '两次输入的密码不一致';
          }
        },
        phone: function(value) {
          if (value && !/^1[3-9]\d{9}$/.test(value)) {
            return '请输入正确的手机号';
          }
        }
      });

      form.on('submit(saveBasic)', function(data) {
        layer.msg('基本信息保存成功', { icon: 1, time: 1500 });
        console.log('保存基本信息:', data.field);
        return false;
      });

      form.on('submit(savePassword)', function(data) {
        layer.msg('密码修改成功', { icon: 1, time: 1500 });
        console.log('修改密码:', data.field);
        data.field.oldPassword = '';
        data.field.newPassword = '';
        data.field.confirmPassword = '';
        return false;
      });

      form.on('submit(saveMobile)', function(data) {
        layer.msg('手机绑定成功', { icon: 1, time: 1500 });
        console.log('绑定手机:', data.field);
        return false;
      });

      var countdown = 0;
      $('#sendSmsBtn').on('click', function() {
        var mobile = $('input[name="mobile"]').val();
        if (!mobile) {
          layer.msg('请先输入手机号', { icon: 0 });
          return;
        }
        if (!/^1[3-9]\d{9}$/.test(mobile)) {
          layer.msg('请输入正确的手机号', { icon: 0 });
          return;
        }
        
        if (countdown > 0) return;
        
        countdown = 60;
        var $btn = $(this);
        $btn.prop('disabled', true).addClass('layui-btn-disabled');
        
        var timer = setInterval(function() {
          countdown--;
          if (countdown > 0) {
            $btn.text(countdown + 's后重发');
          } else {
            clearInterval(timer);
            $btn.text('获取验证码').prop('disabled', false).removeClass('layui-btn-disabled');
          }
        }, 1000);
        
        layer.msg('验证码已发送', { icon: 1 });
      });

      $('.third-party-bind .layui-btn').on('click', function() {
        var type = $(this).attr('id').replace('bind', '').toLowerCase();
        layer.msg('正在跳转' + type + '绑定页面...', { icon: 1, time: 1500 });
      });
    });
  </script>
</body>
</html>
