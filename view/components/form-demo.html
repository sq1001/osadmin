<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表单组件 - Layui</title>
  <meta name="keywords" content="表单,form,输入框,选择框,复选框,开关,单选框">
  <meta name="description" content="Layui表单组件完整示例">
</head>
<body>
<div class="page-content">
  <div class="demo-header">
    <h3 class="demo-title">表单组件</h3>
    <p class="demo-desc">Layui 表单元素的完整示例，包含输入框、选择框、复选框、开关、单选框等</p>
  </div>

  <div class="layui-card">
    <div class="layui-card-header">
      <span class="layui-card-title">普通输入框</span>
    </div>
    <div class="layui-card-body">
      <form class="layui-form">
        <div class="layui-form-item">
          <label class="layui-form-label">文本框</label>
          <div class="layui-input-block">
            <input type="text" name="title" placeholder="请输入标题" class="layui-input">
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">多行文本</label>
          <div class="layui-input-block">
            <textarea name="desc" placeholder="请输入内容" class="layui-textarea"></textarea>
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">禁用状态</label>
          <div class="layui-input-block">
            <input type="text" name="disabled" placeholder="禁用输入框" class="layui-input" disabled>
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">只读状态</label>
          <div class="layui-input-block">
            <input type="text" name="readonly" value="只读输入框" class="layui-input" readonly>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="layui-card">
    <div class="layui-card-header">
      <span class="layui-card-title">前置和后置</span>
    </div>
    <div class="layui-card-body">
      <form class="layui-form">
        <div class="layui-form-item">
          <label class="layui-form-label">身高</label>
          <div class="layui-input-block">
            <div class="layui-input-group">
              <div class="layui-input-split layui-input-prefix">身高</div>
              <input type="text" placeholder="带任意前置和后置内容" class="layui-input">
              <div class="layui-input-split layui-input-suffix">cm</div>
            </div>
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">手机号</label>
          <div class="layui-input-block">
            <div class="layui-input-group">
              <div class="layui-input-split layui-input-prefix">手机号</div>
              <input type="text" placeholder="带任意前置和后置内容" class="layui-input">
              <div class="layui-input-suffix">
                <button class="layui-btn layui-btn-primary">获取验证码</button>
              </div>
            </div>
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">用户名</label>
          <div class="layui-input-block">
            <div class="layui-input-group">
              <div class="layui-input-split layui-input-prefix">用户名</div>
              <input type="text" placeholder="带任意前置内容" class="layui-input">
            </div>
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">搜索</label>
          <div class="layui-input-block">
            <div class="layui-input-group">
              <input type="text" placeholder="带任意后置内容" class="layui-input">
              <div class="layui-input-split layui-input-suffix" style="cursor: pointer;">
                <i class="layui-icon layui-icon-search"></i>
              </div>
            </div>
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">网址</label>
          <div class="layui-input-block">
            <div class="layui-input-group">
              <div class="layui-input-prefix">https://</div>
              <input type="text" placeholder="带任意前置和后置内容" class="layui-input">
              <div class="layui-input-split layui-input-suffix" style="cursor: pointer;">
                <i class="layui-icon layui-icon-search"></i>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="layui-card">
    <div class="layui-card-header">
      <span class="layui-card-title">前缀和后缀</span>
    </div>
    <div class="layui-card-body">
      <form class="layui-form">
        <div class="layui-row layui-col-space16">
          <div class="layui-col-md6">
            <div class="layui-input-wrap">
              <div class="layui-input-prefix">
                <i class="layui-icon layui-icon-username"></i>
              </div>
              <input type="text" placeholder="带前缀图标" class="layui-input">
            </div>
          </div>
          <div class="layui-col-md6">
            <div class="layui-input-wrap">
              <input type="text" placeholder="带后缀图标" class="layui-input">
              <div class="layui-input-suffix">
                <i class="layui-icon layui-icon-search"></i>
              </div>
            </div>
          </div>
          <div class="layui-col-md6">
            <div class="layui-input-wrap">
              <div class="layui-input-prefix layui-input-split">
                <i class="layui-icon layui-icon-username"></i>
              </div>
              <input type="text" placeholder="带前缀和分割框" class="layui-input">
            </div>
          </div>
          <div class="layui-col-md6">
            <div class="layui-input-wrap">
              <input type="text" placeholder="带后缀和分割框" class="layui-input">
              <div class="layui-input-suffix layui-input-split">
                <i class="layui-icon layui-icon-down"></i>
              </div>
            </div>
          </div>
          <div class="layui-col-md6">
            <div class="layui-input-wrap">
              <div class="layui-input-prefix">
                <i class="layui-icon layui-icon-location"></i>
              </div>
              <input type="text" placeholder="带前缀无分割框和后置有分割框" class="layui-input">
              <div class="layui-input-suffix layui-input-split">
                <i class="layui-icon layui-icon-edit"></i>
              </div>
            </div>
          </div>
          <div class="layui-col-md6">
            <div class="layui-input-wrap">
              <div class="layui-input-prefix layui-input-split">
                <i class="layui-icon layui-icon-location"></i>
              </div>
              <input type="text" placeholder="带前缀有分割框和后置无分割框" class="layui-input">
              <div class="layui-input-suffix">
                <i class="layui-icon layui-icon-edit"></i>
              </div>
            </div>
          </div>
          <div class="layui-col-md4">
            <div class="layui-input-wrap">
              <div class="layui-input-prefix">
                <i class="layui-icon layui-icon-form"></i>
              </div>
              <select>
                <option value="">放置 select 元素</option>
                <option value="北京">北京</option>
                <option value="上海">上海</option>
                <option value="广州">广州</option>
                <option value="深圳">深圳</option>
              </select>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="layui-card">
    <div class="layui-card-header">
      <span class="layui-card-title">动态点缀</span>
    </div>
    <div class="layui-card-body">
      <form class="layui-form">
        <div class="layui-form-item">
          <label class="layui-form-label">数字输入框</label>
          <div class="layui-input-block">
            <input type="number" lay-affix="number" placeholder="数字输入框" value="0" class="layui-input">
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">小数精度</label>
          <div class="layui-input-block">
            <input type="text" lay-affix="number" placeholder="设置 step 为 0.01" step="0.01" class="layui-input">
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">范围限制</label>
          <div class="layui-input-block">
            <input type="text" lay-affix="number" placeholder="设置 step,min,max" step="10" min="0" max="100" class="layui-input">
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">小数位精度</label>
          <div class="layui-input-block">
            <input type="text" lay-affix="number" placeholder="设置小数位精度为 2" step="0.1" lay-precision="2" class="layui-input">
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">密码显隐</label>
          <div class="layui-input-block">
            <div class="layui-input-wrap">
              <input type="password" lay-affix="eye" placeholder="请输入密码" class="layui-input">
            </div>
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">内容清除</label>
          <div class="layui-input-block">
            <input type="text" value="默认有值状态" lay-affix="clear" class="layui-input">
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">自定义点缀</label>
          <div class="layui-input-block">
            <input type="text" placeholder="自定义搜索点缀" lay-affix="search" lay-filter="searchInput" class="layui-input">
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="layui-card">
    <div class="layui-card-header">
      <span class="layui-card-title">选择框</span>
    </div>
    <div class="layui-card-body">
      <form class="layui-form" lay-filter="selectForm">
        <div class="layui-form-item">
          <label class="layui-form-label">单选下拉</label>
          <div class="layui-input-block">
            <select name="city" lay-verify="required">
              <option value="">请选择城市</option>
              <option value="0">北京</option>
              <option value="1">上海</option>
              <option value="2">广州</option>
              <option value="3">深圳</option>
              <option value="4">杭州</option>
            </select>
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">分组选择</label>
          <div class="layui-input-block">
            <select name="quiz">
              <option value="">请选择</option>
              <optgroup label="城市记忆">
                <option value="你工作的第一个城市">你工作的第一个城市</option>
              </optgroup>
              <optgroup label="学生时代">
                <option value="你的工号">你的工号</option>
                <option value="你最喜欢的老师">你最喜欢的老师</option>
              </optgroup>
            </select>
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">搜索选择</label>
          <div class="layui-input-block">
            <select name="search" lay-search="">
              <option value="">直接选择或搜索选择</option>
              <option value="1">layer</option>
              <option value="2">form</option>
              <option value="3">layim</option>
              <option value="4">element</option>
              <option value="5">laytpl</option>
              <option value="6">upload</option>
              <option value="7">tree</option>
              <option value="8">table</option>
              <option value="9">laypage</option>
            </select>
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">禁用选择</label>
          <div class="layui-input-block">
            <select name="disabled" disabled>
              <option value="0">禁用选择框</option>
            </select>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="layui-card">
    <div class="layui-card-header">
      <span class="layui-card-title">复选框</span>
    </div>
    <div class="layui-card-body">
      <form class="layui-form" lay-filter="checkboxForm">
        <div class="layui-form-item">
          <label class="layui-form-label">默认风格</label>
          <div class="layui-input-block">
            <input type="checkbox" name="like[write]" title="写作">
            <input type="checkbox" name="like[read]" title="阅读" checked>
            <input type="checkbox" name="like[dai]" title="发呆">
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">原始风格</label>
          <div class="layui-input-block">
            <input type="checkbox" name="like1[write]" lay-skin="primary" title="写作">
            <input type="checkbox" name="like1[read]" lay-skin="primary" title="阅读" checked>
            <input type="checkbox" name="like1[dai]" lay-skin="primary" title="发呆">
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">禁用状态</label>
          <div class="layui-input-block">
            <input type="checkbox" name="disabled" title="禁用" disabled>
            <input type="checkbox" name="disabled2" title="禁用选中" checked disabled>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="layui-card">
    <div class="layui-card-header">
      <span class="layui-card-title">开关</span>
    </div>
    <div class="layui-card-body">
      <form class="layui-form" lay-filter="switchForm">
        <div class="layui-form-item">
          <label class="layui-form-label">默认开关</label>
          <div class="layui-input-block">
            <input type="checkbox" name="switch" lay-skin="switch" lay-text="ON|OFF">
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">选中状态</label>
          <div class="layui-input-block">
            <input type="checkbox" name="switch2" lay-skin="switch" lay-text="开启|关闭" checked>
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">禁用状态</label>
          <div class="layui-input-block">
            <input type="checkbox" name="switch3" lay-skin="switch" disabled>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="layui-card">
    <div class="layui-card-header">
      <span class="layui-card-title">单选框</span>
    </div>
    <div class="layui-card-body">
      <form class="layui-form" lay-filter="radioForm">
        <div class="layui-form-item">
          <label class="layui-form-label">默认风格</label>
          <div class="layui-input-block">
            <input type="radio" name="sex" value="nan" title="男">
            <input type="radio" name="sex" value="nv" title="女" checked>
            <input type="radio" name="sex" value="other" title="保密">
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">禁用状态</label>
          <div class="layui-input-block">
            <input type="radio" name="sex2" value="nan" title="男" disabled>
            <input type="radio" name="sex2" value="nv" title="女" checked disabled>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- radio-card: 卡片风格单选框（纯CSS · 主题适配 · 跨浏览器） -->
  <!-- ========================================== -->
  <div class="layui-card">
    <div class="layui-card-header">
      <span class="layui-card-title">卡片风格单选框（radio-card 组件）</span>
    </div>
    <div class="layui-card-body">
      <style>
        /* ========== radio-card: 纯CSS卡片风格单选框 ========== */

        /* 容器 - 仅做定位容器 */
        .radio-card {
          position: relative;
          display: flex;
          align-items: flex-start;
          user-select: none;
          cursor: pointer;
          height: 100%;
          box-sizing: border-box;
        }

        /* 隐藏原生 radio（但保留可聚焦和键盘操作） */
        .radio-card > input[type="radio"] {
          position: absolute;
          opacity: 0;
          width: 0;
          height: 0;
          margin: 0;
          padding: 0;
          border: none;
          outline: none;
        }

        /* 聚焦时可见轮廓（无障碍支持）- 只作用于 body */
        .radio-card > input[type="radio"]:focus-visible ~ .radio-card__body {
          outline: 2px solid var(--accent, #16b777);
          outline-offset: 2px;
        }

        /* 内容包裹层 - 承载所有视觉样式 */
        .radio-card__body {
          position: relative;
          display: flex;
          align-items: flex-start;
          gap: 12px;
          padding: 16px;
          border-radius: var(--radius-lg, 10px);
          border: 1px solid var(--border, #e5e5e5);
          background: var(--card-bg, #fff);
          color: var(--text-primary, #000);
          transition: all 0.25s ease;
          width: 100%;
          box-sizing: border-box;
        }

        /* 悬停效果 */
        .radio-card:hover .radio-card__body {
          border-color: var(--accent, #16b777);
          box-shadow: 0 2px 8px rgba(99, 102, 241, 0.08);
          transform: translateY(-1px);
        }

        /* ========== 选中状态 - 核心：纯CSS :checked 伪类 ========== */
        .radio-card > input[type="radio"]:checked ~ .radio-card__body {
          border-color: var(--accent, #16b777) !important;
          background: color-mix(in srgb, var(--accent, #16b777) 8%, transparent) !important;
          box-shadow: 0 0 0 1px var(--accent, #16b777), 0 4px 12px rgba(99, 102, 241, 0.12) !important;
          transform: none !important;
        }

        /* 禁用状态 - 只作用于 disabled 的卡片，不影响正常悬浮 */
        .radio-card > input[type="radio"]:disabled ~ .radio-card__body,
        .radio-card.disabled .radio-card__body,
        .radio-card.disabled:hover .radio-card__body {
          opacity: 0.55 !important;
          filter: grayscale(0.3);
          cursor: not-allowed !important;
          pointer-events: auto;
          transform: none !important;
          box-shadow: none !important;
          border-color: var(--border, #e5e5e5) !important;
        }
        .radio-card.disabled {
          cursor: not-allowed;
        }

        /* 图标区域 */
        .radio-card__icon {
          flex-shrink: 0;
          width: 48px;
          height: 48px;
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: 12px;
          background: var(--bg-content, #f8f9fa);
          font-size: 24px;
          color: var(--text-secondary, #666);
          transition: all 0.25s ease;
        }

        /* 选中时图标变色 */
        .radio-card > input[type="radio"]:checked ~ .radio-card__body .radio-card__icon {
          background: var(--accent-light, rgba(99,102,241,0.1));
          color: var(--accent, #16b777);
          transform: scale(1.05);
        }

        /* 内容区域 */
        .radio-card__content {
          flex: 1;
          min-width: 0;
        }

        /* 标题 */
        .radio-card__title {
          font-size: 15px;
          font-weight: 600;
          color: var(--text-primary, #000);
          margin-bottom: 4px;
          line-height: 1.4;
        }

        /* 描述文字 */
        .radio-card__desc {
          font-size: 13px;
          color: var(--text-muted, #999);
          line-height: 1.5;
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        /* ========== 右下角三角+对勾标记 ========== */
        .radio-card__check {
          position: absolute;
          bottom: 0;
          right: 0;
          width: 0;
          height: 0;
          pointer-events: none;
        }

        /* 三角背景 */
        .radio-card__check::before {
          content: '';
          position: absolute;
          bottom: 0;
          right: 0;
          width: 0;
          height: 0;
          border-style: solid;
          border-width: 0 0 22px 22px;
          border-color: transparent transparent var(--border, #ddd) transparent;
          border-bottom-right-radius: var(--radius-lg, 10px);
          transition: all 0.25s ease;
        }

        /* 对勾图标 */
        .radio-card__check::after {
          content: '\e605';
          position: absolute;
          bottom: 3px;
          right: 3px;
          font-family: 'layui-icon' !important;
          font-size: 10px;
          color: #fff;
          line-height: 1;
          z-index: 2;
          opacity: 0;
          transform: scale(0.5);
          transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* 选中时三角变色 + 对勾显示 */
        .radio-card > input[type="radio"]:checked ~ .radio-card__body .radio-card__check::before {
          border-color: transparent transparent var(--accent, #16b777) transparent;
          box-shadow: -2px -2px 6px rgba(99,102,241,0.15);
        }

        .radio-card > input[type="radio"]:checked ~ .radio-card__body .radio-card__check::after {
          opacity: 1;
          transform: scale(1);
        }

        /* 禁用时三角变灰 */
        .radio-card > input[type="radio"]:disabled ~ .radio-card__body .radio-card__check::before {
          border-color: transparent transparent var(--border-light, #d5d5d5) transparent;
          box-shadow: none;
        }

        .radio-card > input[type="radio"]:disabled ~ .radio-card__body .radio-card__check::after,
        .radio-card.disabled .radio-card__check::after {
          color: var(--text-muted, #aaa) !important;
          opacity: 0.4 !important;
          transform: scale(0.8) !important;
        }

        /* 暗色模式适配 */
        [data-theme="dark"] .radio-card__body {
          border-color: rgba(255,255,255,0.1);
        }
        [data-theme="dark"] .radio-card:hover .radio-card__body {
          border-color: var(--accent, #6366f1);
          box-shadow: 0 2px 12px rgba(99, 102, 241, 0.15);
        }
        [data-theme="dark"] .radio-card__icon {
          background: rgba(255,255,255,0.05);
        }
        [data-theme="dark"] .radio-card__check::before {
          border-color: transparent transparent rgba(255,255,255,0.08) transparent;
        }

        .plan-card {
          position: relative;
          user-select: none;
          display: block;

        .plan-card > input[type="radio"] {
          position: absolute;
          opacity: 0;
          width: 0;
          height: 0;
          margin: 0;
          padding: 0;
          border: none;
          outline: none;

          cursor: pointer;
          transition: all 0.28s cubic-bezier(0.25, 0.46, 0.45, 0.94);

        .plan-card__wrap::before {
          content: '';

          inset: 0;
          background: radial-gradient(circle at 50% 0%, var(--accent-soft, rgba(99,102,241,0.06)), transparent 70%);

        /* 悬停 */

        .plan-card:hover .plan-card__wrap::before {
          opacity: 1;

          transform: scale(1.05);

        .plan-card:hover .plan-card__wrap .plan-card__tick {
          border-color: var(--accent, #6366f1);

        }

        /* 选中态 - 跟随主题色，统一视觉 */
        .plan-card > input[type="radio"]:checked ~ .plan-card__wrap {
          border-left: 1.5px solid var(--accent, #6366f1) !important;
          border-right: 1.5px solid var(--accent, #6366f1) !important;
          border-bottom: 1.5px solid var(--accent, #6366f1) !important;

          transform: none !important;
          box-shadow: 0 4px 16px rgba(99, 102, 241, 0.15),

          background: var(--accent, #6366f1);

          color: var(--accent, #6366f1);

          background: var(--accent, #6366f1);
          border-color: var(--accent, #6366f1);

        }

          stroke: #fff;
          stroke-dashoffset: 0;
        }

        /* 禁用状态 */
        .plan-card > input[type="radio"]:disabled ~ .plan-card__wrap,
        .plan-card.disabled .plan-card__wrap,
        .plan-card.disabled:hover .plan-card__wrap {
          cursor: not-allowed !important;
          opacity: 0.45;
          filter: saturate(0);
          pointer-events: auto;
          transform: none !important;
          box-shadow: none !important;

<script>
layui.use(['form', 'layer'], function() {
  var form = layui.form;
  var layer = layui.layer;
  var $ = layui.$;

  form.render();

  form.verify({
    customRule: function(value, elem) {
      if (!value) return;
      if (value.length < 6) {
        return '不能小于 6 个字符';
      }
    }
  });

  form.on('submit(formDemo)', function(data) {
    layer.msg('表单提交成功', { icon: 1 });
    console.log(data.field);
    return false;
  });

  form.on('submit(verifyDemo)', function(data) {
    layer.msg('验证通过，提交成功', { icon: 1 });
    console.log(data.field);
    return false;
  });

  $('#setVal').on('click', function() {
    form.val('valForm', {
      username: 'admin',
      password: '123456',
      city: '上海',
      'like[write]': true,
      'like[read]': true,
      sex: '男',
      status: true
    });
    layer.msg('表单赋值成功', { icon: 1 });
  });

  $('#getVal').on('click', function() {
    var data = form.val('valForm');
    layer.alert(JSON.stringify(data, null, 2), {
      title: '表单数据',
      area: ['400px', 'auto']
    });
  });

  form.on('input-affix(searchInput)', function(data) {
    var elem = data.elem;
    var value = elem.value;
    if (!value) {
      layer.msg('请输入搜索内容');
      return elem.focus();
    }
    layer.msg('搜索: ' + value, { icon: 1 });
  });
});
</script>
