<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统维护中</title>
    <link rel="stylesheet" href="../../admin/css/view/error.css">
</head>
<body class="error-page error-maintenance">
    <div class="error-container">
        <div class="error-illustration">
            <svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">
                <!-- 天空渐变 -->
                <defs>
                    <linearGradient id="skyMaint" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#f0f9ff;stop-opacity:1"/>
                        <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1"/>
                    </linearGradient>
                </defs>
                <rect width="400" height="320" fill="url(#skyMaint)" rx="12"/>

                <!-- 地面 -->
                <path d="M0 270 Q100 260 200 265 Q300 255 400 262 L400 320 L0 320Z" fill="#86efac" opacity="0.35"/>
                <path d="M0 285 Q100 278 200 282 Q300 275 400 280 L400 320 L0 320Z" fill="#4ade80" opacity="0.25"/>

                <!-- 阳光 -->
                <circle cx="320" cy="60" r="30" fill="#fbbf24" opacity="0.3"/>
                <circle cx="320" cy="60" r="22" fill="#fde047" opacity="0.4"/>
                <circle cx="320" cy="60" r="14" fill="#fef08a" opacity="0.5"/>
                <!-- 光线 -->
                <line x1="320" y1="20" x2="320" y2="8" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
                <line x1="350" y1="30" x2="358" y2="22" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
                <line x1="360" y1="60" x2="372" y2="60" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
                <line x1="350" y1="90" x2="358" y2="98" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
                <line x1="290" y1="30" x2="282" y2="22" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
                <line x1="280" y1="60" x2="268" y2="60" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
                <line x1="290" y1="90" x2="282" y2="98" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>

                <!-- 花盆 -->
                <path d="M175 250 L180 300 L230 300 L235 250 Z" fill="#0ea5e9"/>
                <ellipse cx="205" cy="250" rx="32" ry="10" fill="#38bdf8"/>
                <rect x="183" y="265" width="44" height="3" rx="1" fill="#0284c7"/>
                <!-- 土壤 -->
                <ellipse cx="205" cy="252" rx="27" ry="8" fill="#92400e"/>

                <!-- 植物茎 -->
                <path d="M205 250 Q203 220 200 195 Q198 175 200 155" stroke="#16a34a" stroke-width="4" fill="none" stroke-linecap="round"/>

                <!-- 叶子 -->
                <ellipse cx="185" cy="210" rx="20" ry="9" fill="#22c55e" transform="rotate(-30 185 210)"/>
                <ellipse cx="218" cy="200" rx="18" ry="8" fill="#4ade80" transform="rotate(25 218 200)"/>
                <ellipse cx="183" cy="185" rx="16" ry="7.5" fill="#22c55e" transform="rotate(-20 183 185)"/>
                <ellipse cx="220" cy="175" rx="15" ry="7" fill="#4ade80" transform="rotate(20 220 175)"/>

                <!-- 新芽 - 生长动画 -->
                <g transform="translate(200, 148)">
                    <ellipse cx="-10" cy="-8" rx="12" ry="7" fill="#4ade80" transform="rotate(-35 -10 -8)">
                        <animate attributeName="ry" values="7;9;7" dur="2.5s" repeatCount="indefinite"/>
                    </ellipse>
                    <ellipse cx="10" cy="-10" rx="11" ry="6.5" fill="#22c55e" transform="rotate(30 10 -10)">
                        <animate attributeName="ry" values="6.5;8.5;6.5" dur="2.5s" repeatCount="indefinite" begin="0.3s"/>
                    </ellipse>
                    <ellipse cx="0" cy="-16" rx="8" ry="12" fill="#4ade80">
                        <animate attributeName="ry" values="12;15;12" dur="2.5s" repeatCount="indefinite" begin="0.6s"/>
                    </ellipse>
                </g>

                <!-- 浇水壶 -->
                <g transform="translate(110, 210)">
                    <!-- 壶身 -->
                    <ellipse cx="0" cy="8" rx="18" ry="14" fill="#38bdf8"/>
                    <rect x="-18" y="0" width="36" height="14" rx="3" fill="#38bdf8"/>
                    <ellipse cx="0" cy="0" rx="18" ry="7" fill="#7dd3fc"/>
                    <!-- 壶嘴 -->
                    <path d="M18 5 Q30 2 34 8" stroke="#0ea5e9" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <!-- 壶把 -->
                    <path d="M-14 2 Q-22 8 -14 14" stroke="#0ea5e9" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                    <!-- 水滴 -->
                    <circle cx="36" cy="14" r="2.5" fill="#7dd3fc" opacity="0.8">
                        <animate attributeName="cy" values="14;24;14" dur="1.2s" repeatCount="indefinite"/>
                        <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="38" cy="18" r="2" fill="#7dd3fc" opacity="0.6">
                        <animate attributeName="cy" values="18;26;18" dur="1.5s" repeatCount="indefinite"/>
                        <animate attributeName="opacity" values="0.6;0;0.6" dur="1.5s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="34" cy="20" r="1.8" fill="#7dd3fc" opacity="0.7">
                        <animate attributeName="cy" values="20;28;20" dur="1.3s" repeatCount="indefinite"/>
                        <animate attributeName="opacity" values="0.7;0;0.7" dur="1.3s" repeatCount="indefinite"/>
                    </circle>
                </g>

                <!-- 小花装饰 -->
                <g transform="translate(70, 260)">
                    <line x1="0" y1="0" x2="0" y2="15" stroke="#16a34a" stroke-width="2"/>
                    <circle cx="0" cy="-2" r="5" fill="#fbbf24" opacity="0.6"/>
                    <circle cx="0" cy="-2" r="2.5" fill="#fde047" opacity="0.5"/>
                </g>
                <g transform="translate(310, 255)">
                    <line x1="0" y1="0" x2="0" y2="12" stroke="#16a34a" stroke-width="2"/>
                    <circle cx="0" cy="-2" r="4.5" fill="#f87171" opacity="0.6"/>
                    <circle cx="0" cy="-2" r="2" fill="#fbbf24" opacity="0.5"/>
                </g>
                <g transform="translate(340, 262)">
                    <line x1="0" y1="0" x2="0" y2="10" stroke="#16a34a" stroke-width="1.5"/>
                    <circle cx="0" cy="-2" r="3.5" fill="#c084fc" opacity="0.5"/>
                    <circle cx="0" cy="-2" r="1.5" fill="#fde047" opacity="0.4"/>
                </g>

                <!-- 小草 -->
                <path d="M260 268 Q258 258 255 250" stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
                <path d="M265 268 Q268 260 272 253" stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
                <path d="M150 272 Q148 264 145 258" stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>

                <!-- 云朵 -->
                <ellipse cx="80" cy="50" rx="30" ry="15" fill="#fff" opacity="0.6"/>
                <ellipse cx="100" cy="46" rx="24" ry="13" fill="#fff" opacity="0.6"/>
            </svg>
        </div>
        <div class="error-code">维护中</div>
        <div class="error-message">系统正在维护</div>
    </div>
</body>
</html>
