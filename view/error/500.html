<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - 服务器错误</title>
    <link rel="stylesheet" href="../../admin/css/view/error.css">
</head>
<body class="error-page error-500">
    <div class="error-container">
        <div class="error-illustration">
            <svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">
                <!-- 天空渐变 -->
                <defs>
                    <linearGradient id="sky500" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#faf5ff;stop-opacity:1"/>
                        <stop offset="100%" style="stop-color:#f3e8ff;stop-opacity:1"/>
                    </linearGradient>
                </defs>
                <rect width="400" height="320" fill="url(#sky500)" rx="12"/>

                <!-- 地面 -->
                <path d="M0 275 Q100 265 200 270 Q300 260 400 268 L400 320 L0 320Z" fill="#86efac" opacity="0.25"/>
                <path d="M0 290 Q100 283 200 286 Q300 280 400 284 L400 320 L0 320Z" fill="#4ade80" opacity="0.15"/>

                <!-- 乌云 -->
                <ellipse cx="200" cy="60" rx="70" ry="30" fill="#94a3b8" opacity="0.5"/>
                <ellipse cx="170" cy="55" rx="45" ry="25" fill="#94a3b8" opacity="0.45"/>
                <ellipse cx="235" cy="52" rx="40" ry="22" fill="#94a3b8" opacity="0.4"/>
                <ellipse cx="200" cy="45" rx="35" ry="20" fill="#64748b" opacity="0.3"/>
                <!-- 云底暗色 -->
                <ellipse cx="200" cy="72" rx="55" ry="15" fill="#64748b" opacity="0.25"/>

                <!-- 闪电 -->
                <polygon points="195,78 185,120 200,115 190,160 215,108 198,112 208,78" fill="#fbbf24" opacity="0.7">
                    <animate attributeName="opacity" values="0.7;0.3;0.7;0.5;0.7" dur="3s" repeatCount="indefinite"/>
                </polygon>

                <!-- 断裂的大树 -->
                <!-- 树桩 -->
                <rect x="175" y="210" width="22" height="60" rx="4" fill="#78350f"/>
                <rect x="178" y="215" width="5" height="50" rx="2" fill="#5c2d0e" opacity="0.3"/>
                <!-- 断裂面 - 锯齿状 -->
                <path d="M175 210 L180 200 L185 208 L190 195 L195 205 L200 198 L205 208 L197 210 Z" fill="#92400e"/>
                <path d="M175 210 L180 202 L185 208 L190 198 L195 205 L200 200 L205 208 L197 210 Z" fill="#78350f" opacity="0.5"/>

                <!-- 倒下的树干 -->
                <g transform="translate(200, 200) rotate(70)">
                    <rect x="0" y="-7" width="80" height="14" rx="4" fill="#92400e"/>
                    <rect x="5" y="-5" width="3" height="10" rx="1" fill="#78350f" opacity="0.3"/>
                    <rect x="25" y="-5" width="3" height="10" rx="1" fill="#78350f" opacity="0.3"/>
                    <rect x="45" y="-5" width="3" height="10" rx="1" fill="#78350f" opacity="0.3"/>
                    <!-- 断裂端 -->
                    <path d="M0 -7 L-5 -3 L-2 0 L-6 4 L0 7" fill="#78350f"/>
                </g>

                <!-- 散落的树枝 -->
                <line x1="130" y1="260" x2="155" y2="248" stroke="#92400e" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
                <line x1="250" y1="255" x2="270" y2="245" stroke="#92400e" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
                <line x1="140" y1="270" x2="160" y2="262" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>

                <!-- 飘落的叶子 -->
                <ellipse cx="160" cy="180" rx="7" ry="4" fill="#a78bfa" transform="rotate(30 160 180)" opacity="0.5">
                    <animateTransform attributeName="transform" type="rotate" from="30 160 180" to="390 160 180" dur="5s" repeatCount="indefinite"/>
                    <animate attributeName="cy" values="180;250;180" dur="7s" repeatCount="indefinite"/>
                </ellipse>
                <ellipse cx="240" cy="170" rx="6" ry="3.5" fill="#c4b5fd" transform="rotate(-25 240 170)" opacity="0.4">
                    <animateTransform attributeName="transform" type="rotate" from="-25 240 170" to="335 240 170" dur="6s" repeatCount="indefinite"/>
                    <animate attributeName="cy" values="170;245;170" dur="8s" repeatCount="indefinite"/>
                </ellipse>
                <ellipse cx="120" cy="200" rx="5" ry="3" fill="#8b5cf6" transform="rotate(50 120 200)" opacity="0.35">
                    <animateTransform attributeName="transform" type="rotate" from="50 120 200" to="410 120 200" dur="4.5s" repeatCount="indefinite"/>
                    <animate attributeName="cy" values="200;260;200" dur="6s" repeatCount="indefinite"/>
                </ellipse>

                <!-- 小草 -->
                <path d="M100 275 Q98 265 95 258" stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
                <path d="M105 275 Q108 267 112 260" stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
                <path d="M290 270 Q288 260 285 254" stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
                <path d="M295 270 Q298 262 302 256" stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>

                <!-- 远处小树 -->
                <rect x="330" y="220" width="8" height="50" rx="3" fill="#78350f" opacity="0.4"/>
                <ellipse cx="334" cy="210" rx="18" ry="16" fill="#a78bfa" opacity="0.3"/>
                <ellipse cx="334" cy="204" rx="12" ry="10" fill="#c4b5fd" opacity="0.25"/>

                <rect x="60" y="230" width="7" height="42" rx="3" fill="#78350f" opacity="0.4"/>
                <ellipse cx="63" cy="220" rx="16" ry="14" fill="#a78bfa" opacity="0.3"/>
                <ellipse cx="63" cy="215" rx="10" ry="9" fill="#c4b5fd" opacity="0.25"/>
            </svg>
        </div>
        <div class="error-code">500</div>
        <div class="error-message">服务器错误</div>
    </div>
</body>
</html>
