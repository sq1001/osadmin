<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码 - OSAdmin</title>
    <link rel="stylesheet" href="../../admin/css/view/auth.css">
</head>
<body class="auth-page forgot-password-page">
    <div class="auth-toast-box" id="TB"></div>
    <div class="auth-container">
        <div class="auth-left">
            <div class="illustration">
                <svg viewBox="0 0 480 420" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="rainbowBg" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#f5f3ff;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#ecfdf5;stop-opacity:1" />
                        </linearGradient>
                        <linearGradient id="rainbow1" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#f87171;stop-opacity:1" />
                            <stop offset="20%" style="stop-color:#fb923c;stop-opacity:1" />
                            <stop offset="40%" style="stop-color:#fde047;stop-opacity:1" />
                            <stop offset="60%" style="stop-color:#4ade80;stop-opacity:1" />
                            <stop offset="80%" style="stop-color:#60a5fa;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect width="480" height="420" fill="url(#rainbowBg)"/>
                    <ellipse cx="240" cy="380" rx="220" ry="35" fill="#bbf7d0" opacity="0.7"/>
                    <circle cx="380" cy="80" r="32" fill="#fde047" opacity="0.8"/>
                    <circle cx="380" cy="80" r="42" fill="#fde047" opacity="0.25"/>
                    <g opacity="0.9">
                        <ellipse cx="100" cy="90" rx="35" ry="22" fill="#ffffff"/>
                        <ellipse cx="130" cy="80" rx="42" ry="28" fill="#ffffff"/>
                        <ellipse cx="165" cy="92" rx="36" ry="23" fill="#ffffff"/>
                        <ellipse cx="130" cy="102" rx="70" ry="18" fill="#ffffff"/>
                    </g>
                    <g opacity="0.85">
                        <ellipse cx="300" cy="115" rx="30" ry="20" fill="#ffffff"/>
                        <ellipse cx="325" cy="105" rx="38" ry="25" fill="#ffffff"/>
                        <ellipse cx="355" cy="116" rx="32" ry="21" fill="#ffffff"/>
                    </g>
                    <path d="M 80 310 A 160 160 0 0 1 400 310" fill="none" stroke="url(#rainbow1)" stroke-width="22" stroke-linecap="round" opacity="0.9"/>
                    <path d="M 115 310 A 125 125 0 0 1 365 310" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.45"/>
                    <path d="M 150 310 A 90 90 0 0 1 330 310" fill="none" stroke="#a7f3d0" stroke-width="16" stroke-linecap="round" opacity="0.85"/>
                    <circle cx="130" cy="170" r="4" fill="#60a5fa" opacity="0.7">
                        <animate attributeName="cy" values="170;185;170" dur="2s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="220" cy="150" r="3" fill="#60a5fa" opacity="0.6">
                        <animate attributeName="cy" values="150;165;150" dur="2.4s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="320" cy="165" r="4" fill="#60a5fa" opacity="0.7">
                        <animate attributeName="cy" values="165;180;165" dur="2.2s" repeatCount="indefinite"/>
                    </circle>
                    <g transform="translate(190, 330)">
                        <circle cx="0" cy="0" r="6" fill="#f472b6"/>
                        <circle cx="-8" cy="-8" r="6" fill="#f472b6"/>
                        <circle cx="8" cy="-8" r="6" fill="#f472b6"/>
                        <circle cx="0" cy="-16" r="6" fill="#f472b6"/>
                        <circle cx="0" cy="-8" r="4" fill="#fde047"/>
                    </g>
                    <g transform="translate(310, 335)">
                        <circle cx="0" cy="0" r="5" fill="#c084fc"/>
                        <circle cx="-7" cy="-7" r="5" fill="#c084fc"/>
                        <circle cx="7" cy="-7" r="5" fill="#c084fc"/>
                        <circle cx="0" cy="-14" r="5" fill="#c084fc"/>
                        <circle cx="0" cy="-7" r="3.5" fill="#fde047"/>
                    </g>
                    <ellipse cx="240" cy="350" rx="45" ry="12" fill="#93c5fd" opacity="0.4"/>
                    <path d="M 210 350 Q 240 340 270 350" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>
                </svg>
            </div>
        </div>

        <div class="auth-right">
            <div class="auth-form-wrapper">
                <div class="auth-header">
                    <h1 class="auth-title">找回密码</h1>
                    <p class="auth-subtitle">验证邮箱后即可重置登录密码</p>
                </div>

                <div class="steps-indicator two-steps">
                    <div class="step active" data-step="1">
                        <div class="step-number">1</div>
                        <div class="step-label">邮箱验证</div>
                    </div>
                    <div class="step-line"></div>
                    <div class="step" data-step="2">
                        <div class="step-number">2</div>
                        <div class="step-label">重置密码</div>
                    </div>
                </div>

                <form class="auth-form" id="forgotPasswordForm">
                    <div class="step-form active" data-step="1">
                        <div class="form-group" data-field="email">
                            <label for="email" class="sr-only">邮箱</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                    <polyline points="22,6 12,13 2,6"></polyline>
                                </svg>
                                <input type="email" id="email" name="email" placeholder="请输入邮箱地址">
                            </div>
                            <div class="error-tip">请输入有效的邮箱地址</div>
                        </div>

                        <div class="form-group" data-field="captcha">
                            <label for="captcha" class="sr-only">验证码</label>
                            <div class="captcha-wrapper">
                                <div class="input-wrapper captcha-input">
                                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                                    </svg>
                                    <input type="text" id="captcha" name="captcha" placeholder="验证码" maxlength="4">
                                </div>
                                <canvas class="captcha-canvas" id="captchaCvs" width="120" height="48" title="点击刷新验证码"></canvas>
                            </div>
                            <div class="error-tip">验证码不正确</div>
                        </div>

                        <button type="button" class="btn-primary next-step" data-next="2">下一步</button>
                    </div>

                    <div class="step-form" data-step="2">
                        <div class="form-group" data-field="newPassword">
                            <label for="newPassword" class="sr-only">新密码</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                                <input type="password" id="newPassword" name="newPassword" placeholder="请输入新密码">
                                <button type="button" class="password-toggle" aria-label="切换密码可见性">
                                    <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                </button>
                            </div>
                            <div class="error-tip">请输入新密码</div>
                        </div>

                        <div class="form-group" data-field="confirmPassword">
                            <label for="confirmPassword" class="sr-only">确认密码</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M9 12l2 2 4-4"></path>
                                    <path d="M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9c2.39 0 4.56.93 6.17 2.45"></path>
                                </svg>
                                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="请再次输入新密码">
                                <button type="button" class="password-toggle" aria-label="切换密码可见性">
                                    <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                </button>
                            </div>
                            <div class="error-tip">请再次输入新密码</div>
                        </div>

                        <button type="submit" class="btn-primary">确认重置</button>
                    </div>
                </form>

                <div class="auth-footer">
                    <span>想起密码了？</span>
                    <a href="login.html" class="link-text">返回登录</a>
                </div>
            </div>
        </div>
    </div>

    <div class="mobile-decoration">
        <svg viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
            <circle cx="250" cy="80" r="32" fill="#ffffff" opacity="0.14">
                <animate attributeName="opacity" values="0.14;0.28;0.14" dur="4s" repeatCount="indefinite"/>
                <animate attributeName="cy" values="80;88;80" dur="6s" repeatCount="indefinite"/>
            </circle>
            <circle cx="90" cy="120" r="38" fill="#ffffff" opacity="0.12">
                <animate attributeName="opacity" values="0.12;0.26;0.12" dur="4.6s" repeatCount="indefinite"/>
                <animate attributeName="cy" values="120;128;120" dur="7s" repeatCount="indefinite"/>
            </circle>
            <path d="M 80,145 A 120 120 0 0 1 320,145" fill="none" stroke="#ffffff" stroke-width="18" opacity="0.25" stroke-linecap="round">
                <animate attributeName="opacity" values="0.25;0.4;0.25" dur="5s" repeatCount="indefinite"/>
            </path>
            <circle cx="150" cy="50" r="5" fill="#6ee7b7" opacity="0.5">
                <animate attributeName="cy" values="50;65;50" dur="2s" repeatCount="indefinite"/>
            </circle>
            <circle cx="200" cy="45" r="4" fill="#6ee7b7" opacity="0.4">
                <animate attributeName="cy" values="45;60;45" dur="2.3s" repeatCount="indefinite"/>
            </circle>
            <circle cx="270" cy="55" r="4.5" fill="#6ee7b7" opacity="0.45">
                <animate attributeName="cy" values="55;70;55" dur="2.1s" repeatCount="indefinite"/>
            </circle>
        </svg>
    </div>

    <script>
    (function () {
        'use strict';

        // Toast
        var TB = document.getElementById('TB');
        var toastIcons = {
            success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>',
            error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
            info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
        };
        function toast(type, message) {
            var el = document.createElement('div');
            el.className = 'auth-toast-item ' + type;
            el.innerHTML = '<div class="auth-toast-icon">' + toastIcons[type] + '</div>' +
                '<div class="auth-toast-content">' + message + '</div>';
            TB.appendChild(el);
            setTimeout(function() {
                if (el.parentNode) {
                    el.classList.add('auth-toast-out');
                    el.addEventListener('animationend', function() { el.remove(); });
                }
            }, 3000);
        }

        // 表单验证
        function clearError(field) {
            var group = document.querySelector('[data-field="' + field + '"]');
            if (group) {
                group.classList.remove('has-error');
                var wrapper = group.querySelector('.input-wrapper');
                if (wrapper) wrapper.classList.remove('has-error');
            }
        }
        function showError(field, msg) {
            var group = document.querySelector('[data-field="' + field + '"]');
            if (group) {
                group.classList.add('has-error');
                var wrapper = group.querySelector('.input-wrapper');
                if (wrapper) wrapper.classList.add('has-error');
            }
        }

        // 输入时清除错误
        document.getElementById('email').addEventListener('input', function() { clearError('email'); });
        document.getElementById('captcha').addEventListener('input', function() { clearError('captcha'); });
        document.getElementById('newPassword').addEventListener('input', function() { clearError('newPassword'); });
        document.getElementById('confirmPassword').addEventListener('input', function() { clearError('confirmPassword'); });

        document.querySelectorAll('.password-toggle').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.previousElementSibling;
                if (input.type === 'password') {
                    input.type = 'text';
                    this.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
                } else {
                    input.type = 'password';
                    this.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
                }
            });
        });

        // 验证码生成
        var captchaCode = '';
        function generateCaptcha() {
            var canvas = document.getElementById('captchaCvs');
            var c = canvas.getContext('2d');
            var w = canvas.width, h = canvas.height;
            var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
            captchaCode = '';
            for (var i = 0; i < 4; i++) captchaCode += chars.charAt(Math.floor(Math.random() * chars.length));

            c.fillStyle = '#f6f9fc';
            c.fillRect(0, 0, w, h);

            c.strokeStyle = 'rgba(0,0,0,.03)';
            c.lineWidth = 0.5;
            for (var x = 0; x < w; x += 8) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke(); }
            for (var y = 0; y < h; y += 8) { c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); }

            for (var i = 0; i < 60; i++) {
                c.fillStyle = 'rgba(' + Math.floor(Math.random() * 200) + ',' + Math.floor(Math.random() * 200) + ',' + Math.floor(Math.random() * 200) + ',.25)';
                c.fillRect(Math.random() * w, Math.random() * h, 2, 2);
            }

            for (var i = 0; i < 3; i++) {
                c.beginPath();
                c.moveTo(Math.random() * w, Math.random() * h);
                c.lineTo(Math.random() * w, Math.random() * h);
                c.strokeStyle = 'rgba(59,130,246,.12)';
                c.lineWidth = 1;
                c.stroke();
            }

            var colors = ['#2563eb', '#1d4ed8', '#3b82f6', '#1e40af'];
            for (var i = 0; i < 4; i++) {
                c.save();
                c.font = (18 + Math.random() * 6) + 'px sans-serif';
                c.fillStyle = colors[i % colors.length];
                c.translate(18 + i * 25, h / 2 + 6);
                c.rotate((Math.random() - 0.5) * 0.5);
                c.fillText(captchaCode[i], 0, 0);
                c.restore();
            }
        }
        generateCaptcha();

        // 验证码点击刷新
        document.getElementById('captchaCvs').addEventListener('click', generateCaptcha);

        // 下一步按钮
        document.querySelectorAll('.next-step').forEach(btn => {
            btn.addEventListener('click', function() {
                var email = document.getElementById('email').value.trim();
                var cap = document.getElementById('captcha').value.trim();
                var emailReg = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (!email || !emailReg.test(email)) {
                    showError('email', '请输入有效的邮箱地址');
                    toast('error', '请输入有效的邮箱地址');
                    return;
                }
                if (!cap || cap.toLowerCase() !== captchaCode.toLowerCase()) {
                    showError('captcha', '验证码不正确');
                    generateCaptcha();
                    document.getElementById('captcha').value = '';
                    toast('error', '验证码不正确');
                    return;
                }

                var nextStep = this.dataset.next;
                document.querySelectorAll('.step-form').forEach(form => form.classList.remove('active'));
                document.querySelector('.step-form[data-step="' + nextStep + '"]').classList.add('active');
                document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
                document.querySelector('.step[data-step="' + nextStep + '"]').classList.add('active');
            });
        });

        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var newPassword = document.getElementById('newPassword').value.trim();
            var confirmPassword = document.getElementById('confirmPassword').value.trim();

            if (!newPassword) {
                showError('newPassword', '请输入新密码');
                toast('error', '请输入新密码');
                return;
            }
            if (!confirmPassword) {
                showError('confirmPassword', '请再次输入新密码');
                toast('error', '请再次输入新密码');
                return;
            }
            console.log('密码重置提交');
        });
    })();
    </script>
</body>
</html>
