<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码 - OSAdmin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../admin/css/view/auth3.css">
</head>
<body>

<!-- Canvas 粒子背景 -->
<canvas class="auth-canvas-bg" id="bgCvs"></canvas>

<!-- Toast 容器 -->
<div class="auth-toast-box" id="TB"></div>

<!-- 主分栏布局 -->
<div class="auth-split">
    <!-- 左侧：天蓝渐变 -->
    <div class="auth-split-left auth-bg-cyan">
        <div class="auth-float-bubble auth-float-1"></div>
        <div class="auth-float-bubble auth-float-2"></div>
        <div class="auth-float-bubble auth-float-3"></div>
        <div class="auth-float-bubble auth-float-4"></div>
        <div class="auth-left-content">
            <!-- SVG 插画：锁+钥匙+盾牌 -->
            <svg class="auth-illustration" viewBox="0 0 480 380" fill="none">
                <defs>
                    <linearGradient id="lockBody" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#bae6fd"/>
                        <stop offset="100%" stop-color="#7dd3fc"/>
                    </linearGradient>
                    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#0ea5e9"/>
                        <stop offset="100%" stop-color="#0284c7"/>
                    </linearGradient>
                    <linearGradient id="keyGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#f5c542"/>
                        <stop offset="100%" stop-color="#e6a817"/>
                    </linearGradient>
                    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="100%" stop-color="#e0f2fe"/>
                    </linearGradient>
                </defs>
                <!-- 底部阴影 -->
                <ellipse cx="240" cy="345" rx="155" ry="12" fill="#0ea5e9" opacity="0.18"/>
                <!-- 背景装饰圆 -->
                <circle cx="240" cy="195" r="140" fill="#0ea5e9" opacity="0.12"/>
                <circle cx="240" cy="195" r="100" fill="#38bdf8" opacity="0.08"/>

                <!-- 盾牌 -->
                <g transform="translate(240, 180)">
                    <path d="M0,-65 L55,-42 L55,15 C55,48 30,72 0,88 C-30,72 -55,48 -55,15 L-55,-42 Z" fill="url(#shieldGrad)" opacity="0.85"/>
                    <!-- 盾牌高光 -->
                    <path d="M0,-55 L42,-36 L42,10 C42,36 24,56 0,68 C-24,56 -42,36 -42,10 L-42,-36 Z" fill="#fff" opacity="0.1"/>
                    <!-- 盾牌内锁图标 -->
                    <g transform="translate(0, 5)">
                        <path d="M-12,-22 C-12,-35 12,-35 12,-22" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85"/>
                        <rect x="-16" y="-22" width="32" height="24" rx="4" fill="#fff" opacity="0.85"/>
                        <circle cx="0" cy="-12" r="5" fill="#0ea5e9" opacity="0.7"/>
                        <rect x="-2.5" y="-9" width="5" height="8" rx="1.5" fill="#0ea5e9" opacity="0.7"/>
                    </g>
                </g>

                <!-- 钥匙（浮动动画） -->
                <g>
                    <animate attributeName="transform" values="translate(0,0);translate(0,-8);translate(0,0)" dur="3s" repeatCount="indefinite"/>
                    <!-- 钥匙头 -->
                    <circle cx="358" cy="90" r="14" fill="url(#keyGrad)" stroke="#e6a817" stroke-width="1.5"/>
                    <circle cx="358" cy="90" r="6" fill="#0ea5e9" opacity="0.3"/>
                    <!-- 钥匙杆 -->
                    <rect x="370" y="86" width="28" height="8" rx="4" fill="url(#keyGrad)"/>
                    <!-- 钥匙齿 -->
                    <rect x="388" y="86" width="6" height="14" rx="2" fill="url(#keyGrad)"/>
                    <rect x="396" y="86" width="6" height="11" rx="2" fill="url(#keyGrad)"/>
                    <!-- 钥匙高光 -->
                    <circle cx="355" cy="87" r="3" fill="#ffffff" opacity="0.4"/>
                </g>

                <!-- 浮动数据粒子 - 左侧 -->
                <g opacity="0.5">
                    <rect x="80" y="140" width="30" height="20" rx="4" fill="#7dd3fc" opacity="0.4"/>
                    <rect x="86" y="147" width="18" height="2.5" rx="1" fill="#fff" opacity="0.4"/>
                    <rect x="86" y="152" width="12" height="2.5" rx="1" fill="#fff" opacity="0.3"/>
                    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="4s" repeatCount="indefinite"/>
                </g>

                <!-- 浮动数据粒子 - 右侧 -->
                <g opacity="0.4">
                    <rect x="400" y="200" width="30" height="20" rx="4" fill="#38bdf8" opacity="0.4"/>
                    <rect x="406" y="207" width="18" height="2.5" rx="1" fill="#fff" opacity="0.4"/>
                    <rect x="406" y="212" width="12" height="2.5" rx="1" fill="#fff" opacity="0.3"/>
                    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3.5s" repeatCount="indefinite"/>
                </g>

                <!-- 装饰几何：菱形 -->
                <g opacity="0.5">
                    <rect x="82" y="218" width="12" height="12" rx="2" fill="#bae6fd" transform="rotate(45 88 224)">
                        <animate attributeName="opacity" values="0.5;0.8;0.5" dur="4s" repeatCount="indefinite"/>
                    </rect>
                </g>
                <!-- 装饰几何：小三角 -->
                <polygon points="405,130 412,144 398,144" fill="#38bdf8" opacity="0.4">
                    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3.5s" repeatCount="indefinite"/>
                </polygon>
                <!-- 浮动装饰圆点 -->
                <circle cx="90" cy="270" r="4" fill="#bae6fd" opacity="0.6">
                    <animate attributeName="cy" values="270;262;270" dur="3.5s" repeatCount="indefinite"/>
                </circle>
                <circle cx="400" cy="160" r="3.5" fill="#f5c542" opacity="0.5">
                    <animate attributeName="cy" values="160;152;160" dur="4s" repeatCount="indefinite"/>
                </circle>
                <circle cx="370" cy="280" r="3" fill="#7dd3fc" opacity="0.5">
                    <animate attributeName="cy" values="280;273;280" dur="3s" repeatCount="indefinite"/>
                </circle>
                <circle cx="130" cy="140" r="2.5" fill="#f5c542" opacity="0.4">
                    <animate attributeName="cy" values="140;134;140" dur="3.8s" repeatCount="indefinite"/>
                </circle>
                <!-- 装饰：十字形 -->
                <g transform="translate(420, 250)" opacity="0.4">
                    <rect x="-1.5" y="-6" width="3" height="12" rx="1" fill="#bae6fd"/>
                    <rect x="-6" y="-1.5" width="12" height="3" rx="1" fill="#bae6fd"/>
                    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="5s" repeatCount="indefinite"/>
                </g>
                <!-- 装饰：小圆环 -->
                <circle cx="68" cy="170" r="6" stroke="#bae6fd" stroke-width="1.5" fill="none" opacity="0.4">
                    <animate attributeName="r" values="6;7.5;6" dur="4s" repeatCount="indefinite"/>
                </circle>
                <!-- 解锁粒子效果 -->
                <circle cx="240" cy="110" r="2" fill="#f5c542" opacity="0">
                    <animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite"/>
                    <animate attributeName="cy" values="110;98;110" dur="3s" repeatCount="indefinite"/>
                </circle>
                <circle cx="252" cy="106" r="1.5" fill="#bae6fd" opacity="0">
                    <animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="0.5s" repeatCount="indefinite"/>
                    <animate attributeName="cy" values="106;94;106" dur="3s" begin="0.5s" repeatCount="indefinite"/>
                </circle>
                <circle cx="228" cy="108" r="1.8" fill="#f5c542" opacity="0">
                    <animate attributeName="opacity" values="0;0.6;0" dur="3s" begin="1s" repeatCount="indefinite"/>
                    <animate attributeName="cy" values="108;96;108" dur="3s" begin="1s" repeatCount="indefinite"/>
                </circle>
            </svg>

        </div>
    </div>

    <!-- 右侧：表单卡片 -->
    <div class="auth-split-right">
        <div class="auth-form-card" style="max-width:440px">

            <div class="auth-form-header auth-anim auth-anim-1">
                <div class="auth-form-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <div class="auth-form-brand">
                    <div class="auth-form-title">找回密码</div>
                    <div class="auth-form-subtitle">重置您的账户密码</div>
                </div>
            </div>

            <!-- 步骤条 -->
            <div class="auth-steps" id="stepBar">
                <div class="auth-step-dot auth-step-active" data-s="1">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 4L12 13 2 4"/></svg>
                </div>
                <div class="auth-step-track" id="tk1"><div class="auth-step-fill"></div></div>
                <div class="auth-step-dot" data-s="2">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </div>
                <div class="auth-step-track" id="tk2"><div class="auth-step-fill"></div></div>
                <div class="auth-step-dot" data-s="3">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                </div>
            </div>

            <!-- 步骤1：输入邮箱 -->
            <div id="step1" class="auth-anim">
                <div style="text-align:center;margin-bottom:2px">
                    <div class="auth-step-icon-box">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                    </div>
                </div>
                <h2 class="auth-form-title" style="text-align:center;font-size:20px">忘记密码?</h2>
                <p class="auth-form-subtitle" style="text-align:center;line-height:1.7">输入邮箱地址，我们将发送验证码</p>
                <div class="auth-input-group" style="margin-top:20px">
                    <label>邮箱</label>
                    <div class="auth-input-wrapper" data-i="fe">
                        <span class="auth-input-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 4L12 13 2 4"/></svg></span>
                        <input type="email" id="fe" placeholder="name@example.com">
                    </div>
                    <div class="auth-input-error">请输入有效的邮箱</div>
                </div>
                <button class="auth-btn-primary" style="margin-top:16px" id="step1Btn">发送验证码</button>
            </div>

            <!-- 步骤2：输入验证码 -->
            <div id="step2" style="display:none">
                <div style="text-align:center;margin-bottom:2px">
                    <div class="auth-step-icon-box">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    </div>
                </div>
                <h2 class="auth-form-title" style="text-align:center;font-size:20px">输入验证码</h2>
                <p class="auth-form-subtitle" style="text-align:center">已发送至 <span id="emailShow" style="color:var(--auth-accent);font-weight:600"></span></p>
                <div class="auth-code-row" id="codeRow">
                    <input type="text" maxlength="1" class="auth-code-input" data-idx="0">
                    <input type="text" maxlength="1" class="auth-code-input" data-idx="1">
                    <input type="text" maxlength="1" class="auth-code-input" data-idx="2">
                    <input type="text" maxlength="1" class="auth-code-input" data-idx="3">
                    <input type="text" maxlength="1" class="auth-code-input" data-idx="4">
                    <input type="text" maxlength="1" class="auth-code-input" data-idx="5">
                </div>
                <p style="text-align:center;font-size:11px;color:var(--auth-muted)">
                    没有收到? <span class="auth-link" style="font-size:11px" id="resendLink">重新发送</span><span id="resendTimer" style="color:var(--auth-accent);display:none"></span>
                </p>
                <button class="auth-btn-primary" style="margin-top:12px" id="step2Btn">验证</button>
            </div>

            <!-- 步骤3：重设密码 -->
            <div id="step3" style="display:none">
                <div style="text-align:center;margin-bottom:2px">
                    <div class="auth-step-icon-box">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                    </div>
                </div>
                <h2 class="auth-form-title" style="text-align:center;font-size:20px">重设密码</h2>
                <p class="auth-form-subtitle" style="text-align:center">输入你的新密码</p>
                <div class="auth-input-group" style="margin-top:20px">
                    <label>新密码</label>
                    <div class="auth-input-wrapper" data-i="np">
                        <span class="auth-input-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></span>
                        <input type="password" id="np" placeholder="至少6位字符">
                        <button type="button" class="auth-input-action" id="togglePwdNp" aria-label="显示密码"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </div>
                    <div class="auth-input-error">密码至少6位</div>
                </div>
                <div class="auth-input-group" style="margin-top:12px">
                    <label>确认密码</label>
                    <div class="auth-input-wrapper" data-i="cp">
                        <span class="auth-input-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></span>
                        <input type="password" id="cp" placeholder="再次输入新密码">
                        <button type="button" class="auth-input-action" id="togglePwdCp" aria-label="显示密码"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </div>
                    <div class="auth-input-error">两次密码不一致</div>
                </div>
                <button class="auth-btn-primary" style="margin-top:16px" id="step3Btn">重设密码</button>
            </div>

            <!-- 成功 -->
            <div id="stepSuccess" style="display:none;text-align:center">
                <div class="auth-success-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="var(--auth-success)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>
                </div>
                <h2 class="auth-form-title" style="font-size:20px">密码已重置</h2>
                <p class="auth-form-subtitle" style="line-height:1.7">你的密码已成功更新，现在可以使用新密码登录</p>
                <button class="auth-btn-primary" style="margin-top:18px" id="goLoginBtn">前往登录</button>
            </div>

            <!-- 返回登录 -->
            <p style="text-align:center;margin-top:18px;font-size:12px;color:var(--auth-fg2)">
                <a href="login.html" class="auth-link">
                    <svg style="width:11px;height:11px;vertical-align:middle;margin-right:3px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>返回登录
                </a>
            </p>
        </div>
    </div>
</div>

<script>
(function () {
    'use strict';

    /* ===== Canvas 粒子背景（浮动光点，无连线） ===== */
    var c = document.getElementById('bgCvs'), ctx = c.getContext('2d');
    var W, H, pts = [];
    var N = 25, SP = 0.35;

    function resize(){
        W = c.width = window.innerWidth;
        H = c.height = window.innerHeight;
        init();
    }

    function init(){
        pts = [];
        for(var i = 0; i < N; i++){
            pts.push({
                x: Math.random() * W,
                y: Math.random() * H,
                vx: (Math.random() - 0.5) * SP,
                vy: (Math.random() - 0.5) * SP,
                r: Math.random() * 3 + 1.5
            });
        }
    }

    function draw(){
        ctx.clearRect(0, 0, W, H);
        for(var k = 0; k < pts.length; k++){
            var p = pts[k];
            ctx.beginPath();
            ctx.arc(p.x, p.y, Math.max(0.5, p.r), 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(14, 165, 233, ' + (0.08 + p.r * 0.04) + ')';
            ctx.fill();
            p.x += p.vx; p.y += p.vy;
            if(p.x < 0 || p.x > W) p.vx *= -1;
            if(p.y < 0 || p.y > H) p.vy *= -1;
        }
        requestAnimationFrame(draw);
    }

    resize(); draw();
    window.addEventListener('resize', resize);

    /* ===== Toast ===== */
    var toastIcons = {
        success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>',
        error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
        info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
    };
    function toast(type, msg){
        var box = document.getElementById('TB'), el = document.createElement('div');
        el.className = 'auth-toast-item ' + type;
        el.innerHTML = '<div class="auth-toast-icon">' + toastIcons[type] + '</div>' +
            '<div class="auth-toast-content">' + msg + '</div>';
        box.appendChild(el);
        setTimeout(function(){
            if (el.parentNode) {
                el.classList.add('auth-toast-out');
                el.addEventListener('animationend', function () { el.remove(); });
            }
        }, 3000);
    }

    /* ===== 密码显隐 ===== */
    function togglePwd(id, btn){
        var inp = document.getElementById(id);
        if(inp.type === 'password'){
            inp.type = 'text';
            btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
        } else {
            inp.type = 'password';
            btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        }
    }

    document.getElementById('togglePwdNp').addEventListener('click', function () {
        togglePwd('np', this);
    });
    document.getElementById('togglePwdCp').addEventListener('click', function () {
        togglePwd('cp', this);
    });

    /* ===== 输入框聚焦追踪 ===== */
    document.querySelectorAll('.auth-input-wrapper input').forEach(function(inp){
        inp.addEventListener('focus', function(){ inp.closest('.auth-input-wrapper').classList.add('auth-focused'); });
        inp.addEventListener('blur', function(){ inp.closest('.auth-input-wrapper').classList.remove('auth-focused'); });
        inp.addEventListener('input', function(){ inp.closest('.auth-input-group').classList.remove('auth-error'); });
    });

    /* ===== 按钮波纹效果 ===== */
    document.addEventListener('click', function(e){
        var btn = e.target.closest('.auth-btn-primary');
        if(!btn) return;
        var r = document.createElement('span');
        r.className = 'auth-ripple';
        var rc = btn.getBoundingClientRect(), sz = Math.max(rc.width, rc.height);
        r.style.width = r.style.height = sz + 'px';
        r.style.left = (e.clientX - rc.left - sz / 2) + 'px';
        r.style.top = (e.clientY - rc.top - sz / 2) + 'px';
        btn.appendChild(r);
        setTimeout(function(){ r.remove(); }, 500);
    });

    /* ===== 邮箱验证 ===== */
    function isValidEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

    /* ===== 步骤管理 ===== */
    var currentStep = 1;

    function updateSteps(cur){
        var dots = document.querySelectorAll('.auth-step-dot');
        dots.forEach(function(dot, i){
            dot.classList.remove('auth-step-active', 'auth-step-done');
            if(i + 1 < cur){
                dot.classList.add('auth-step-done');
                dot.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>';
            }
        });
        document.getElementById('tk1').classList.toggle('auth-step-filled', cur >= 2);
        document.getElementById('tk2').classList.toggle('auth-step-filled', cur >= 3);
    }

    /* ===== 步骤1：发送验证码 ===== */
    function handleStep1(e){
        var email = document.getElementById('fe').value.trim();
        if(!email || !isValidEmail(email)){
            document.getElementById('fe').closest('.auth-input-group').classList.add('auth-error');
            toast('error', '请输入有效的邮箱');
            return;
        }
        var btn = e.target.closest('.auth-btn-primary'), orig = btn.textContent;
        btn.innerHTML = '<span class="auth-spinner"></span>'; btn.disabled = true;
        setTimeout(function(){
            btn.textContent = orig; btn.disabled = false;
            document.getElementById('emailShow').textContent = email;
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
            currentStep = 2;
            updateSteps(2);
            toast('success', '验证码已发送');
            startResendCountdown();
            document.querySelector('#codeRow .auth-code-input').focus();
        }, 1100);
    }

    document.getElementById('step1Btn').addEventListener('click', function (e) {
        handleStep1(e);
    });

    /* ===== 验证码输入：自动跳转 & 退格回退 ===== */
    function codeInput(inp, idx){
        inp.value = inp.value.replace(/[^0-9]/g, '');
        if(inp.value && idx < 5){
            var inputs = document.querySelectorAll('#codeRow .auth-code-input');
            inputs[idx + 1].focus();
        }
    }

    function codeKey(e, inp){
        if(e.key === 'Backspace' && !inp.value){
            var prev = inp.previousElementSibling;
            if(prev && prev.classList.contains('auth-code-input')){
                prev.focus(); prev.value = '';
            }
        }
    }

    document.querySelectorAll('#codeRow .auth-code-input').forEach(function (inp) {
        var idx = parseInt(inp.getAttribute('data-idx'), 10);
        inp.addEventListener('input', function () { codeInput(inp, idx); });
        inp.addEventListener('keydown', function (e) { codeKey(e, inp); });
    });

    /* ===== 重新发送倒计时 ===== */
    var resendInterval = null;

    function startResendCountdown(){
        var link = document.getElementById('resendLink'), timer = document.getElementById('resendTimer');
        var sec = 60;
        link.style.display = 'none';
        timer.style.display = 'inline';
        if(resendInterval) clearInterval(resendInterval);
        resendInterval = setInterval(function(){
            sec--;
            timer.textContent = sec + 's';
            if(sec <= 0){
                clearInterval(resendInterval);
                link.style.display = 'inline';
                timer.style.display = 'none';
            }
        }, 1000);
    }

    function resendCode(){
        toast('info', '验证码已重新发送');
        startResendCountdown();
    }

    document.getElementById('resendLink').addEventListener('click', resendCode);

    /* ===== 步骤2：验证验证码 ===== */
    function handleStep2(e){
        var inputs = document.querySelectorAll('#codeRow .auth-code-input');
        var code = '';
        inputs.forEach(function(inp){ code += inp.value; });
        if(code.length < 6){
            toast('error', '请输入完整6位验证码');
            return;
        }
        var btn = e.target.closest('.auth-btn-primary'), orig = btn.textContent;
        btn.innerHTML = '<span class="auth-spinner"></span>'; btn.disabled = true;
        setTimeout(function(){
            btn.textContent = orig; btn.disabled = false;
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step3').style.display = 'block';
            currentStep = 3;
            updateSteps(3);
            toast('success', '验证码正确');
        }, 900);
    }

    document.getElementById('step2Btn').addEventListener('click', function (e) {
        handleStep2(e);
    });

    /* ===== 步骤3：重设密码 ===== */
    function handleStep3(e){
        var p1 = document.getElementById('np').value, p2 = document.getElementById('cp').value;
        if(p1.length < 6){
            document.getElementById('np').closest('.auth-input-group').classList.add('auth-error');
            toast('error', '密码至少6位');
            return;
        }
        if(p1 !== p2){
            document.getElementById('cp').closest('.auth-input-group').classList.add('auth-error');
            toast('error', '两次密码不一致');
            return;
        }
        var btn = e.target.closest('.auth-btn-primary'), orig = btn.textContent;
        btn.innerHTML = '<span class="auth-spinner"></span>'; btn.disabled = true;
        setTimeout(function(){
            btn.textContent = orig; btn.disabled = false;
            document.getElementById('step3').style.display = 'none';
            document.getElementById('stepSuccess').style.display = 'block';
            updateSteps(4);
            toast('success', '密码已成功重置');
        }, 1100);
    }

    document.getElementById('step3Btn').addEventListener('click', function (e) {
        handleStep3(e);
    });

    /* ===== 前往登录 ===== */
    function goLogin(){
        window.location.href = 'login.html';
    }

    document.getElementById('goLoginBtn').addEventListener('click', goLogin);

    /* ===== 重置所有步骤 ===== */
    function resetAll(){
        currentStep = 1;
        updateSteps(1);
        var dots = document.querySelectorAll('.auth-step-dot');
        dots[0].innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 4L12 13 2 4"/></svg>';
        dots[1].innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>';
        dots[2].innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>';
        document.getElementById('step1').style.display = 'block';
        document.getElementById('step2').style.display = 'none';
        document.getElementById('step3').style.display = 'none';
        document.getElementById('stepSuccess').style.display = 'none';
        document.getElementById('fe').value = '';
        document.querySelectorAll('#codeRow .auth-code-input').forEach(function(inp){ inp.value = ''; });
        document.getElementById('np').value = '';
        document.getElementById('cp').value = '';
        if(resendInterval) clearInterval(resendInterval);
        document.getElementById('resendLink').style.display = 'inline';
        document.getElementById('resendTimer').style.display = 'none';
    }

})();
</script>
</body>
</html>
