<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - OSAdmin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../admin/css/view/auth3.css">
</head>
<body>

<!-- Canvas 粒子背景 -->
<canvas class="auth-canvas-bg" id="bgCvs"></canvas>

<!-- Toast 容器 -->
<div class="auth-toast-box" id="TB"></div>

<!-- 主分栏布局 -->
<div class="auth-split">
    <!-- 左侧(视觉): 天蓝渐变 + 插画 -->
    <div class="auth-split-left auth-bg-teal">
        <div class="auth-float-bubble auth-float-1"></div>
        <div class="auth-float-bubble auth-float-2"></div>
        <div class="auth-float-bubble auth-float-3"></div>
        <div class="auth-float-bubble auth-float-4"></div>
        <div class="auth-left-content">
            <!-- SVG 插画: 云同步/数据上传 -->
            <svg class="auth-illustration" viewBox="0 0 400 300" fill="none">
                <defs>
                    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#e0f2fe"/>
                        <stop offset="100%" stop-color="#bae6fd"/>
                    </linearGradient>
                    <linearGradient id="uploadGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#0ea5e9"/>
                        <stop offset="100%" stop-color="#0284c7"/>
                    </linearGradient>
                    <linearGradient id="dataGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#38bdf8"/>
                        <stop offset="100%" stop-color="#7dd3fc"/>
                    </linearGradient>
                </defs>

                <!-- 背景装饰圆 -->
                <circle cx="200" cy="150" r="130" fill="rgba(255,255,255,.08)"/>
                <circle cx="200" cy="150" r="90" fill="rgba(255,255,255,.06)"/>

                <!-- 云朵主体 -->
                <g>
                    <ellipse cx="200" cy="140" rx="80" ry="45" fill="url(#cloudGrad)" opacity="0.9"/>
                    <circle cx="155" cy="125" r="35" fill="url(#cloudGrad)" opacity="0.9"/>
                    <circle cx="200" cy="110" r="40" fill="url(#cloudGrad)" opacity="0.9"/>
                    <circle cx="245" cy="125" r="35" fill="url(#cloudGrad)" opacity="0.9"/>
                    <!-- 云朵底部 -->
                    <rect x="120" y="130" width="160" height="30" rx="0" fill="url(#cloudGrad)" opacity="0.9"/>
                    <!-- 云朵高光 -->
                    <ellipse cx="190" cy="105" rx="25" ry="12" fill="#fff" opacity="0.3"/>
                    <animate attributeName="transform" values="translate(0,0);translate(0,-5);translate(0,0)" dur="4s" repeatCount="indefinite"/>
                </g>

                <!-- 上传箭头 -->
                <g>
                    <rect x="193" y="170" width="14" height="50" rx="7" fill="url(#uploadGrad)"/>
                    <polygon points="200,145 180,175 220,175" fill="url(#uploadGrad)"/>
                    <animate attributeName="transform" values="translate(0,0);translate(0,-8);translate(0,0)" dur="2s" repeatCount="indefinite"/>
                </g>

                <!-- 数据块1 - 左下 -->
                <g>
                    <rect x="80" y="200" width="40" height="28" rx="5" fill="url(#dataGrad)" opacity="0.7"/>
                    <rect x="88" y="208" width="24" height="3" rx="1.5" fill="#fff" opacity="0.5"/>
                    <rect x="88" y="214" width="18" height="3" rx="1.5" fill="#fff" opacity="0.3"/>
                    <animate attributeName="transform" values="translate(0,0);translate(0,-6);translate(0,0)" dur="3s" repeatCount="indefinite"/>
                </g>

                <!-- 数据块2 - 右下 -->
                <g>
                    <rect x="280" y="195" width="40" height="28" rx="5" fill="url(#dataGrad)" opacity="0.7"/>
                    <rect x="288" y="203" width="24" height="3" rx="1.5" fill="#fff" opacity="0.5"/>
                    <rect x="288" y="209" width="18" height="3" rx="1.5" fill="#fff" opacity="0.3"/>
                    <animate attributeName="transform" values="translate(0,0);translate(0,-5);translate(0,0)" dur="3.5s" repeatCount="indefinite"/>
                </g>

                <!-- 数据块3 - 左 -->
                <g>
                    <rect x="60" y="140" width="35" height="24" rx="4" fill="#7dd3fc" opacity="0.5"/>
                    <rect x="67" y="147" width="20" height="2.5" rx="1" fill="#fff" opacity="0.4"/>
                    <rect x="67" y="152" width="14" height="2.5" rx="1" fill="#fff" opacity="0.3"/>
                    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" repeatCount="indefinite"/>
                </g>

                <!-- 数据块4 - 右 -->
                <g>
                    <rect x="310" y="135" width="35" height="24" rx="4" fill="#7dd3fc" opacity="0.5"/>
                    <rect x="317" y="142" width="20" height="2.5" rx="1" fill="#fff" opacity="0.4"/>
                    <rect x="317" y="147" width="14" height="2.5" rx="1" fill="#fff" opacity="0.3"/>
                    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3.2s" repeatCount="indefinite"/>
                </g>

                <!-- 连接线 - 数据流向云 -->
                <line x1="100" y1="200" x2="160" y2="165" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.3">
                    <animate attributeName="stroke-dashoffset" values="0;-7" dur="1s" repeatCount="indefinite"/>
                </line>
                <line x1="300" y1="195" x2="245" y2="165" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.3">
                    <animate attributeName="stroke-dashoffset" values="0;-7" dur="1s" repeatCount="indefinite"/>
                </line>

                <!-- 信号波纹 -->
                <circle cx="200" cy="140" r="50" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0">
                    <animate attributeName="r" values="50;80" dur="2s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" values="0.3;0" dur="2s" repeatCount="indefinite"/>
                </circle>
                <circle cx="200" cy="140" r="50" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0">
                    <animate attributeName="r" values="50;80" dur="2s" begin="1s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" values="0.3;0" dur="2s" begin="1s" repeatCount="indefinite"/>
                </circle>

                <!-- 星星装饰 -->
                <g fill="#fff">
                    <polygon points="80,60 83,68 91,68 85,73 87,81 80,76 73,81 75,73 69,68 77,68">
                        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
                    </polygon>
                    <polygon points="340,80 342,86 348,86 343,90 345,96 340,92 335,96 337,90 332,86 338,86" opacity="0.7">
                        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
                    </polygon>
                    <polygon points="55,180 57,185 62,185 58,188 59,193 55,190 51,193 52,188 48,185 53,185" opacity="0.6">
                        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.8s" repeatCount="indefinite"/>
                    </polygon>
                </g>

                <!-- 浮动粒子/圆点 -->
                <circle cx="100" cy="100" r="3" fill="rgba(56,189,248,.5)">
                    <animate attributeName="cy" values="100;92;100" dur="3.5s" repeatCount="indefinite"/>
                </circle>
                <circle cx="310" cy="110" r="2.5" fill="rgba(125,211,252,.4)">
                    <animate attributeName="cy" values="110;103;110" dur="4s" repeatCount="indefinite"/>
                </circle>
                <circle cx="55" cy="240" r="2" fill="rgba(14,165,233,.5)">
                    <animate attributeName="cy" values="240;234;240" dur="3s" repeatCount="indefinite"/>
                </circle>
                <circle cx="350" cy="220" r="2.5" fill="rgba(56,189,248,.35)">
                    <animate attributeName="cy" values="220;214;220" dur="3.2s" repeatCount="indefinite"/>
                </circle>

                <!-- 几何装饰: 小菱形 -->
                <rect x="70" y="95" width="8" height="8" rx="1" fill="rgba(56,189,248,.4)" transform="rotate(45 74 99)">
                    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
                </rect>
                <rect x="325" y="250" width="6" height="6" rx="1" fill="rgba(125,211,252,.3)" transform="rotate(45 328 253)">
                    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.5s" repeatCount="indefinite"/>
                </rect>

                <!-- 小三角装饰 -->
                <polygon points="260,250 264,258 256,258" fill="rgba(14,165,233,.35)">
                    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
                </polygon>
            </svg>

        </div>
    </div>

    <!-- 右侧(表单): 注册表单 -->
    <div class="auth-split-right">
        <div class="auth-form-card">

            <div class="auth-form-header auth-anim auth-anim-1">
                <div class="auth-form-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <div class="auth-form-brand">
                    <div class="auth-form-title">创建账户</div>
                    <div class="auth-form-subtitle">注册您的账户</div>
                </div>
            </div>

            <form id="registerForm" style="margin-top:22px">
                <!-- 用户名 -->
                <div class="auth-input-group auth-anim auth-anim-1">
                    <label>用户名</label>
                    <div class="auth-input-wrapper" data-i="rn">
                        <span class="auth-input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </span>
                        <input type="text" id="rn" placeholder="你的名字">
                    </div>
                    <div class="auth-input-error">请输入用户名</div>
                </div>
                <!-- 邮箱 -->
                <div class="auth-input-group auth-anim auth-anim-2" style="margin-top:12px">
                    <label>邮箱</label>
                    <div class="auth-input-wrapper" data-i="re">
                        <span class="auth-input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                                <rect x="2" y="4" width="20" height="16" rx="2"/>
                                <path d="M22 4L12 13 2 4"/>
                            </svg>
                        </span>
                        <input type="email" id="re" placeholder="name@example.com">
                    </div>
                    <div class="auth-input-error">请输入有效的邮箱</div>
                </div>
                <!-- 密码 -->
                <div class="auth-input-group auth-anim auth-anim-3" style="margin-top:12px">
                    <label>密码</label>
                    <div class="auth-input-wrapper" data-i="rp">
                        <span class="auth-input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                                <rect x="3" y="11" width="18" height="11" rx="2"/>
                                <path d="M7 11V7a5 5 0 0110 0v4"/>
                            </svg>
                        </span>
                        <input type="password" id="rp" placeholder="至少6位字符">
                        <button type="button" class="auth-input-action" id="togglePwdRp" aria-label="显示密码">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <div class="auth-input-error">密码至少6位</div>
                    <div class="auth-strength-bar" id="strengthBar">
                        <div class="auth-strength-seg"></div>
                        <div class="auth-strength-seg"></div>
                        <div class="auth-strength-seg"></div>
                        <div class="auth-strength-seg"></div>
                    </div>
                    <div class="auth-strength-label" id="strengthLabel"></div>
                </div>
                <!-- 确认密码 -->
                <div class="auth-input-group auth-anim auth-anim-4" style="margin-top:12px">
                    <label>确认密码</label>
                    <div class="auth-input-wrapper" data-i="rc">
                        <span class="auth-input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                                <rect x="3" y="11" width="18" height="11" rx="2"/>
                                <path d="M7 11V7a5 5 0 0110 0v4"/>
                            </svg>
                        </span>
                        <input type="password" id="rc" placeholder="再次输入密码">
                        <button type="button" class="auth-input-action" id="togglePwdRc" aria-label="显示密码">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <div class="auth-input-error">两次密码不一致</div>
                </div>
                <!-- 验证码 -->
                <div class="auth-input-group auth-anim auth-anim-5" style="margin-top:12px">
                    <label>验证码</label>
                    <div class="auth-captcha-row">
                        <div class="auth-input-wrapper" data-i="rca">
                            <span class="auth-input-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                                </svg>
                            </span>
                            <input type="text" id="rca" placeholder="输入验证码" maxlength="4" autocomplete="off">
                        </div>
                        <canvas id="captchaCvs" class="auth-captcha-canvas" width="120" height="40"></canvas>
                    </div>
                    <div class="auth-input-error">验证码不正确</div>
                </div>
                <!-- 同意条款 -->
                <label class="auth-checkbox-wrap auth-anim auth-anim-6" style="margin-top:14px">
                    <input type="checkbox" id="agreeTerms">
                    <span class="auth-checkbox">
                        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round">
                            <path d="M5 13l4 4L19 7"/>
                        </svg>
                    </span>
                    <span style="font-size:11px">我已阅读并同意 <span class="auth-link" style="font-size:11px">服务条款</span> 和 <span class="auth-link" style="font-size:11px">隐私政策</span></span>
                </label>
                <!-- 注册按钮 -->
                <button type="submit" class="auth-btn-primary auth-anim auth-anim-6" style="margin-top:16px" id="registerBtn">注册</button>
            </form>
            <p class="auth-anim auth-anim-6" style="text-align:center;margin-top:18px;font-size:12px;color:var(--auth-fg2)">已有账户? <a href="login.html" class="auth-link">立即登录</a></p>
        </div>
    </div>
</div>

<script>
(function () {
    'use strict';

    /* ===== Canvas 粒子背景（浮动光点，无连线） ===== */
    var c = document.getElementById('bgCvs'),
        x = c.getContext('2d');
    var W, H, pts = [];
    var N = 25, SP = 0.35;

    function rs(){
        W = c.width = window.innerWidth;
        H = c.height = window.innerHeight;
        init();
    }
    function init(){
        pts = [];
        for(var i = 0; i < N; i++){
            pts.push({
                x: Math.random() * W,
                y: Math.random() * H,
                vx: (Math.random() - 0.5) * SP,
                vy: (Math.random() - 0.5) * SP,
                r: Math.random() * 3 + 1.5
            });
        }
    }
    function draw(){
        x.clearRect(0, 0, W, H);
        for(var k = 0; k < pts.length; k++){
            var p = pts[k];
            x.beginPath();
            x.arc(p.x, p.y, Math.max(0.5, p.r), 0, Math.PI * 2);
            x.fillStyle = 'rgba(14, 165, 233, ' + (0.08 + p.r * 0.04) + ')';
            x.fill();
            p.x += p.vx;
            p.y += p.vy;
            if(p.x < 0 || p.x > W) p.vx *= -1;
            if(p.y < 0 || p.y > H) p.vy *= -1;
        }
        requestAnimationFrame(draw);
    }
    rs();
    draw();
    window.addEventListener('resize', rs);

    /* ===== Toast ===== */
    var toastIcons = {
        success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>',
        error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
        info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
    };
    function toast(type, msg){
        var box = document.getElementById('TB'),
            el = document.createElement('div');
        el.className = 'auth-toast-item ' + type;
        el.innerHTML = '<div class="auth-toast-icon">' + toastIcons[type] + '</div>' +
            '<div class="auth-toast-content">' + msg + '</div>';
        box.appendChild(el);
        setTimeout(function(){
            if (el.parentNode) {
                el.classList.add('auth-toast-out');
                el.addEventListener('animationend', function () { el.remove(); });
            }
        }, 3000);
    }

    /* ===== 密码显隐 ===== */
    function togglePwd(id, btn){
        var inp = document.getElementById(id);
        if(inp.type === 'password'){
            inp.type = 'text';
            btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
        } else {
            inp.type = 'password';
            btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        }
    }

    document.getElementById('togglePwdRp').addEventListener('click', function () {
        togglePwd('rp', this);
    });
    document.getElementById('togglePwdRc').addEventListener('click', function () {
        togglePwd('rc', this);
    });

    /* ===== 输入框聚焦跟踪 ===== */
    document.querySelectorAll('.auth-input-wrapper input').forEach(function(inp){
        inp.addEventListener('focus', function(){
            inp.closest('.auth-input-wrapper').classList.add('auth-focused');
        });
        inp.addEventListener('blur', function(){
            inp.closest('.auth-input-wrapper').classList.remove('auth-focused');
        });
        inp.addEventListener('input', function(){
            inp.closest('.auth-input-group').classList.remove('auth-error');
        });
    });

    /* ===== 按钮波纹效果 ===== */
    document.addEventListener('click', function(e){
        var btn = e.target.closest('.auth-btn-primary');
        if(!btn) return;
        var r = document.createElement('span');
        r.className = 'auth-ripple';
        var rc = btn.getBoundingClientRect(),
            sz = Math.max(rc.width, rc.height);
        r.style.width = r.style.height = sz + 'px';
        r.style.left = (e.clientX - rc.left - sz / 2) + 'px';
        r.style.top = (e.clientY - rc.top - sz / 2) + 'px';
        btn.appendChild(r);
        setTimeout(function(){ r.remove(); }, 500);
    });

    /* ===== 验证码 Canvas ===== */
    var captchaCode = '';
    function genCaptcha(){
        var cv = document.getElementById('captchaCvs'),
            ctx = cv.getContext('2d');
        var ch = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
        var code = '';
        for(var i = 0; i < 4; i++) code += ch[Math.floor(Math.random() * ch.length)];
        captchaCode = code.toLowerCase();

        ctx.fillStyle = '#f0f9ff';
        ctx.fillRect(0, 0, cv.width, cv.height);

        /* 网格纹理 */
        ctx.strokeStyle = 'rgba(14,165,233,.04)';
        ctx.lineWidth = 0.5;
        for(var gx = 0; gx < cv.width; gx += 8){
            ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, cv.height); ctx.stroke();
        }
        for(var gy = 0; gy < cv.height; gy += 8){
            ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(cv.width, gy); ctx.stroke();
        }

        /* 干扰线 */
        for(var li = 0; li < 4; li++){
            ctx.strokeStyle = 'rgba(14,165,233,' + (Math.random() * 0.12 + 0.04) + ')';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(Math.random() * cv.width, Math.random() * cv.height);
            ctx.lineTo(Math.random() * cv.width, Math.random() * cv.height);
            ctx.stroke();
        }

        /* 噪点 */
        for(var ni = 0; ni < 25; ni++){
            ctx.fillStyle = 'rgba(14,165,233,' + (Math.random() * 0.15 + 0.04) + ')';
            ctx.fillRect(Math.random() * cv.width, Math.random() * cv.height, 1.5, 1.5);
        }

        /* 文字 */
        var colors = ['#0ea5e9', '#0284c7', '#38bdf8', '#0369a1'];
        ctx.textBaseline = 'middle';
        for(var ci = 0; ci < code.length; ci++){
            ctx.save();
            ctx.font = (20 + Math.floor(Math.random() * 6)) + 'px Plus Jakarta Sans';
            ctx.fillStyle = colors[ci % colors.length];
            ctx.translate(16 + ci * 26, cv.height / 2 + (Math.random() * 4 - 2));
            ctx.rotate((Math.random() - 0.5) * 0.4);
            ctx.fillText(code[ci], 0, 0);
            ctx.restore();
        }
    }
    setTimeout(genCaptcha, 100);
    document.getElementById('captchaCvs').addEventListener('click', genCaptcha);

    /* ===== 密码强度检测 ===== */
    function checkStrength(value){
        var bar = document.getElementById('strengthBar'),
            label = document.getElementById('strengthLabel');
        var level = 0;
        if(value.length >= 6) level++;
        if(value.length >= 10) level++;
        if(/[A-Z]/.test(value) && /[a-z]/.test(value)) level++;
        if(/[0-9]/.test(value) && /[^A-Za-z0-9]/.test(value)) level++;

        bar.className = 'auth-strength-bar' + (level > 0 ? ' auth-level-' + level : '');

        var texts = ['', '弱', '一般', '强', '非常强'];
        var colors = ['', 'var(--auth-danger)', 'var(--auth-warning)', 'var(--auth-accent)', 'var(--auth-success)'];
        label.textContent = value ? '密码强度: ' + texts[level] : '';
        label.style.color = colors[level] || 'var(--auth-muted)';
    }

    document.getElementById('rp').addEventListener('input', function () {
        checkStrength(this.value);
    });

    /* ===== 邮箱验证 ===== */
    function isValidEmail(e){
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
    }

    /* ===== 注册处理 ===== */
    function handleRegister(e){
        var name = document.getElementById('rn').value.trim(),
            email = document.getElementById('re').value.trim(),
            pwd = document.getElementById('rp').value,
            cpwd = document.getElementById('rc').value,
            captcha = document.getElementById('rca').value.trim(),
            agreed = document.getElementById('agreeTerms').checked;

        if(!name){
            document.getElementById('rn').closest('.auth-input-group').classList.add('auth-error');
            toast('error', '请输入用户名');
            return;
        }
        if(!email || !isValidEmail(email)){
            document.getElementById('re').closest('.auth-input-group').classList.add('auth-error');
            toast('error', '请输入有效的邮箱');
            return;
        }
        if(pwd.length < 6){
            document.getElementById('rp').closest('.auth-input-group').classList.add('auth-error');
            toast('error', '密码至少6位');
            return;
        }
        if(pwd !== cpwd){
            document.getElementById('rc').closest('.auth-input-group').classList.add('auth-error');
            toast('error', '两次密码不一致');
            return;
        }
        if(!captcha || captcha.toLowerCase() !== captchaCode){
            document.getElementById('rca').closest('.auth-input-group').classList.add('auth-error');
            toast('error', '验证码不正确');
            return;
        }
        if(!agreed){
            toast('error', '请先同意服务条款');
            return;
        }

        var btn = e.target.closest('.auth-btn-primary'),
            orig = btn.textContent;
        btn.innerHTML = '<span class="auth-spinner"></span>';
        btn.disabled = true;

        setTimeout(function(){
            btn.textContent = orig;
            btn.disabled = false;
            toast('success', '注册成功! 请登录');
            genCaptcha();
        }, 1400);
    }

    document.getElementById('registerBtn').addEventListener('click', function (e) {
        handleRegister(e);
    });

    document.getElementById('registerForm').addEventListener('submit', function (e) {
        e.preventDefault();
    });

})();
</script>
</body>
</html>
