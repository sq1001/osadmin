<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - OSAdmin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../admin/css/view/auth3.css">
</head>
<body>

<!-- Canvas 粒子背景 -->
<canvas class="auth-canvas-bg" id="bgCvs"></canvas>

<!-- 全屏浮动气泡 -->
<div class="auth-float-bubble auth-float-1"></div>
<div class="auth-float-bubble auth-float-2"></div>
<div class="auth-float-bubble auth-float-3"></div>
<div class="auth-float-bubble auth-float-4"></div>

<!-- Toast 容器 -->
<div class="auth-toast-box" id="TB"></div>

<!-- 主分栏布局 -->
<div class="auth-split">

    <!-- 左侧：科技插画 -->
    <div class="auth-split-left">
        <div class="auth-left-content">
            <!-- 登录场景 SVG 插画：科技数据中心 -->
            <div class="auth-illustration auth-anim auth-anim-1">
                <svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="skyChip" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#0ea5e9"/>
                            <stop offset="100%" stop-color="#0284c7"/>
                        </linearGradient>
                        <linearGradient id="skyLight" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#e0f2fe"/>
                            <stop offset="100%" stop-color="#bae6fd"/>
                        </linearGradient>
                        <linearGradient id="skyGlow" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#7dd3fc"/>
                            <stop offset="100%" stop-color="#38bdf8"/>
                        </linearGradient>
                        <linearGradient id="serverGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#fff"/>
                            <stop offset="100%" stop-color="#e0f2fe"/>
                        </linearGradient>
                        <linearGradient id="skyFade" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.08"/>
                            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.03"/>
                        </linearGradient>
                    </defs>

                    <!-- 背景光晕 -->
                    <ellipse cx="250" cy="160" rx="200" ry="130" fill="url(#skyFade)"/>

                    <!-- 外圈轨道 -->
                    <ellipse cx="250" cy="155" rx="170" ry="100" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.12"/>
                    <ellipse cx="250" cy="155" rx="135" ry="80" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.08"/>
                    <ellipse cx="250" cy="155" rx="200" ry="120" fill="none" stroke="#7dd3fc" stroke-width="0.6" opacity="0.06" stroke-dasharray="6 4"/>

                    <!-- 轨道上的光点 -->
                    <circle r="3.5" fill="#38bdf8" opacity="0.7">
                        <animateMotion dur="8s" repeatCount="indefinite" path="M250,55 A100,100 0 1,1 249,55"/>
                    </circle>
                    <circle r="2.5" fill="#7dd3fc" opacity="0.5">
                        <animateMotion dur="12s" repeatCount="indefinite" path="M250,75 A80,80 0 1,0 251,75"/>
                    </circle>
                    <circle r="2" fill="#0ea5e9" opacity="0.4">
                        <animateMotion dur="16s" repeatCount="indefinite" path="M250,35 A120,120 0 1,1 249,35"/>
                    </circle>

                    <!-- 中心芯片 -->
                    <rect x="210" y="110" width="80" height="80" rx="12" fill="url(#skyChip)" opacity="0.9"/>
                    <!-- 芯片内电路纹路 -->
                    <line x1="230" y1="130" x2="270" y2="130" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
                    <line x1="230" y1="140" x2="270" y2="140" stroke="#fff" stroke-width="1.5" opacity="0.3"/>
                    <line x1="230" y1="150" x2="270" y2="150" stroke="#fff" stroke-width="1.5" opacity="0.35"/>
                    <line x1="230" y1="160" x2="270" y2="160" stroke="#fff" stroke-width="1.5" opacity="0.25"/>
                    <!-- 芯片中心核心 -->
                    <circle cx="250" cy="145" r="14" fill="#fff" opacity="0.2"/>
                    <circle cx="250" cy="145" r="8" fill="#fff" opacity="0.3"/>
                    <!-- 芯片引脚 - 上 -->
                    <rect x="228" y="100" width="4" height="12" rx="1" fill="#38bdf8" opacity="0.6"/>
                    <rect x="240" y="100" width="4" height="12" rx="1" fill="#38bdf8" opacity="0.6"/>
                    <rect x="252" y="100" width="4" height="12" rx="1" fill="#38bdf8" opacity="0.6"/>
                    <rect x="264" y="100" width="4" height="12" rx="1" fill="#38bdf8" opacity="0.6"/>
                    <!-- 芯片引脚 - 下 -->
                    <rect x="228" y="188" width="4" height="12" rx="1" fill="#38bdf8" opacity="0.6"/>
                    <rect x="240" y="188" width="4" height="12" rx="1" fill="#38bdf8" opacity="0.6"/>
                    <rect x="252" y="188" width="4" height="12" rx="1" fill="#38bdf8" opacity="0.6"/>
                    <rect x="264" y="188" width="4" height="12" rx="1" fill="#38bdf8" opacity="0.6"/>
                    <!-- 芯片引脚 - 左 -->
                    <rect x="198" y="123" width="14" height="4" rx="1" fill="#38bdf8" opacity="0.6"/>
                    <rect x="198" y="135" width="14" height="4" rx="1" fill="#38bdf8" opacity="0.6"/>
                    <rect x="198" y="147" width="14" height="4" rx="1" fill="#38bdf8" opacity="0.6"/>
                    <rect x="198" y="159" width="14" height="4" rx="1" fill="#38bdf8" opacity="0.6"/>
                    <!-- 芯片引脚 - 右 -->
                    <rect x="288" y="123" width="14" height="4" rx="1" fill="#38bdf8" opacity="0.6"/>
                    <rect x="288" y="135" width="14" height="4" rx="1" fill="#38bdf8" opacity="0.6"/>
                    <rect x="288" y="147" width="14" height="4" rx="1" fill="#38bdf8" opacity="0.6"/>
                    <rect x="288" y="159" width="14" height="4" rx="1" fill="#38bdf8" opacity="0.6"/>

                    <!-- 卫星球 - 左上：数据节点 -->
                    <circle cx="120" cy="90" r="24" fill="url(#skyLight)" opacity="0.7"/>
                    <circle cx="120" cy="90" r="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>
                    <g transform="translate(120, 88)">
                        <circle cx="0" cy="0" r="3" fill="#0ea5e9" opacity="0.7"/>
                        <circle cx="-7" cy="-6" r="2" fill="#0ea5e9" opacity="0.5"/>
                        <circle cx="7" cy="-6" r="2" fill="#0ea5e9" opacity="0.5"/>
                        <circle cx="0" cy="7" r="2" fill="#0ea5e9" opacity="0.5"/>
                        <line x1="0" y1="0" x2="-7" y2="-6" stroke="#0ea5e9" stroke-width="1" opacity="0.4"/>
                        <line x1="0" y1="0" x2="7" y2="-6" stroke="#0ea5e9" stroke-width="1" opacity="0.4"/>
                        <line x1="0" y1="0" x2="0" y2="7" stroke="#0ea5e9" stroke-width="1" opacity="0.4"/>
                    </g>

                    <!-- 卫星球 - 右下：服务器 -->
                    <circle cx="370" cy="195" r="22" fill="url(#skyLight)" opacity="0.7"/>
                    <circle cx="370" cy="195" r="22" fill="none" stroke="#7dd3fc" stroke-width="1.5" opacity="0.3"/>
                    <g transform="translate(370, 193)">
                        <rect x="-8" y="-9" width="16" height="5" rx="1.5" fill="#0ea5e9" opacity="0.5"/>
                        <rect x="-8" y="-2" width="16" height="5" rx="1.5" fill="#0ea5e9" opacity="0.5"/>
                        <rect x="-8" y="5" width="16" height="5" rx="1.5" fill="#0ea5e9" opacity="0.5"/>
                        <circle cx="5" cy="-6.5" r="1.2" fill="#7dd3fc" opacity="0.7"/>
                        <circle cx="5" cy="0.5" r="1.2" fill="#7dd3fc" opacity="0.7"/>
                        <circle cx="5" cy="7.5" r="1.2" fill="#7dd3fc" opacity="0.7"/>
                    </g>

                    <!-- 卫星球 - 右上：信号 -->
                    <circle cx="360" cy="80" r="16" fill="url(#skyLight)" opacity="0.6"/>
                    <circle cx="360" cy="80" r="16" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.25"/>
                    <g transform="translate(360, 80)">
                        <circle cx="0" cy="0" r="2.5" fill="#0ea5e9" opacity="0.7"/>
                        <path d="M-5,-5 A7,7 0 0,1 5,-5" stroke="#0ea5e9" stroke-width="1.5" fill="none" opacity="0.5"/>
                        <path d="M-8,-8 A11,11 0 0,1 8,-8" stroke="#0ea5e9" stroke-width="1.5" fill="none" opacity="0.3"/>
                    </g>

                    <!-- 卫星球 - 左下：安全锁 -->
                    <circle cx="100" cy="230" r="18" fill="url(#skyLight)" opacity="0.6"/>
                    <circle cx="100" cy="230" r="18" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.25"/>
                    <g transform="translate(100, 232)">
                        <rect x="-6" y="-2" width="12" height="9" rx="2" fill="#0ea5e9" opacity="0.5"/>
                        <path d="M-4,-2 L-4,-5 A4,4 0 0,1 4,-5 L4,-2" stroke="#0ea5e9" stroke-width="1.5" fill="none" opacity="0.5"/>
                        <circle cx="0" cy="2" r="1.5" fill="#7dd3fc" opacity="0.7"/>
                    </g>

                    <!-- 连接线 -->
                    <line x1="205" y1="125" x2="142" y2="100" stroke="#0ea5e9" stroke-width="1" opacity="0.15" stroke-dasharray="3 3"/>
                    <line x1="295" y1="180" x2="350" y2="188" stroke="#0ea5e9" stroke-width="1" opacity="0.15" stroke-dasharray="3 3"/>
                    <line x1="295" y1="125" x2="346" y2="88" stroke="#0ea5e9" stroke-width="1" opacity="0.12" stroke-dasharray="3 3"/>
                    <line x1="205" y1="175" x2="116" y2="215" stroke="#0ea5e9" stroke-width="1" opacity="0.12" stroke-dasharray="3 3"/>

                    <!-- 数据流 - 左侧 -->
                    <g opacity="0.3">
                        <line x1="20" y1="70" x2="98" y2="88" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>
                        <circle cx="20" cy="70" r="3" fill="#38bdf8" opacity="0.5"/>
                    </g>

                    <!-- 数据流 - 右侧 -->
                    <g opacity="0.3">
                        <line x1="390" y1="60" x2="460" y2="42" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="4 3"/>
                        <circle cx="460" cy="42" r="3" fill="#7dd3fc" opacity="0.5"/>
                    </g>

                    <!-- 数据流 - 左下 -->
                    <g opacity="0.2">
                        <line x1="30" y1="260" x2="84" y2="240" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>
                        <circle cx="30" cy="260" r="2.5" fill="#38bdf8" opacity="0.4"/>
                    </g>

                    <!-- 数据流 - 右下 -->
                    <g opacity="0.2">
                        <line x1="390" y1="210" x2="460" y2="230" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="4 3"/>
                        <circle cx="460" cy="230" r="2.5" fill="#7dd3fc" opacity="0.4"/>
                    </g>

                    <!-- 装饰六边形 - 左上 -->
                    <polygon points="55,48 69,40 83,48 83,64 69,72 55,64" fill="url(#skyLight)" opacity="0.3"/>
                    <!-- 装饰六边形 - 右侧 -->
                    <polygon points="430,120 440,114 450,120 450,132 440,138 430,132" fill="url(#skyLight)" opacity="0.2"/>

                    <!-- 装饰圆环 -->
                    <circle cx="42" cy="155" r="14" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.15"/>
                    <circle cx="42" cy="155" r="6" fill="#38bdf8" opacity="0.08"/>
                    <circle cx="455" cy="140" r="10" fill="none" stroke="#7dd3fc" stroke-width="1.5" opacity="0.15"/>
                    <circle cx="455" cy="140" r="4" fill="#7dd3fc" opacity="0.06"/>

                    <!-- 装饰菱形 -->
                    <polygon points="440,70 448,78 440,86 432,78" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.15"/>

                    <!-- 浮动粒子 -->
                    <circle cx="75" cy="75" r="2.5" fill="#38bdf8" opacity="0.25"/>
                    <circle cx="90" cy="40" r="1.8" fill="#7dd3fc" opacity="0.2"/>
                    <circle cx="410" cy="65" r="2" fill="#7dd3fc" opacity="0.2"/>
                    <circle cx="470" cy="170" r="1.5" fill="#38bdf8" opacity="0.2"/>
                    <circle cx="30" cy="180" r="2" fill="#0ea5e9" opacity="0.15"/>
                    <circle cx="470" cy="280" r="1.8" fill="#7dd3fc" opacity="0.15"/>
                    <circle cx="60" cy="300" r="2.2" fill="#38bdf8" opacity="0.15"/>

                    <!-- ===== 下方：服务器机架 ===== -->

                    <!-- 地面 -->
                    <line x1="60" y1="370" x2="440" y2="370" stroke="#38bdf8" stroke-width="1" opacity="0.08"/>

                    <!-- 服务器机架 -->
                    <rect x="195" y="270" width="110" height="100" rx="6" fill="url(#serverGrad)"/>
                    <!-- 机架单元1 -->
                    <rect x="202" y="277" width="96" height="16" rx="3" fill="#e0f2fe" opacity="0.8"/>
                    <circle cx="288" cy="285" r="2.5" fill="#0ea5e9" opacity="0.7">
                        <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="282" cy="285" r="2.5" fill="#38bdf8" opacity="0.5"/>
                    <rect x="208" y="282" width="30" height="2.5" rx="1" fill="#bae6fd" opacity="0.6"/>
                    <rect x="208" y="287" width="20" height="2" rx="1" fill="#bae6fd" opacity="0.4"/>
                    <!-- 机架单元2 -->
                    <rect x="202" y="297" width="96" height="16" rx="3" fill="#e0f2fe" opacity="0.8"/>
                    <circle cx="288" cy="305" r="2.5" fill="#0ea5e9" opacity="0.5"/>
                    <circle cx="282" cy="305" r="2.5" fill="#7dd3fc" opacity="0.7">
                        <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.8s" repeatCount="indefinite"/>
                    </circle>
                    <rect x="208" y="302" width="35" height="2.5" rx="1" fill="#bae6fd" opacity="0.6"/>
                    <rect x="208" y="307" width="22" height="2" rx="1" fill="#bae6fd" opacity="0.4"/>
                    <!-- 机架单元3 -->
                    <rect x="202" y="317" width="96" height="16" rx="3" fill="#e0f2fe" opacity="0.8"/>
                    <circle cx="288" cy="325" r="2.5" fill="#38bdf8" opacity="0.6">
                        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.2s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="282" cy="325" r="2.5" fill="#0ea5e9" opacity="0.5"/>
                    <rect x="208" y="322" width="28" height="2.5" rx="1" fill="#bae6fd" opacity="0.6"/>
                    <rect x="208" y="327" width="18" height="2" rx="1" fill="#bae6fd" opacity="0.4"/>
                    <!-- 机架单元4 -->
                    <rect x="202" y="337" width="96" height="16" rx="3" fill="#e0f2fe" opacity="0.8"/>
                    <circle cx="288" cy="345" r="2.5" fill="#0ea5e9" opacity="0.6"/>
                    <circle cx="282" cy="345" r="2.5" fill="#7dd3fc" opacity="0.5">
                        <animate attributeName="opacity" values="0.5;0.2;0.5" dur="1.5s" repeatCount="indefinite"/>
                    </circle>
                    <rect x="208" y="342" width="32" height="2.5" rx="1" fill="#bae6fd" opacity="0.6"/>
                    <rect x="208" y="347" width="24" height="2" rx="1" fill="#bae6fd" opacity="0.4"/>

                    <!-- 机架底部支撑 -->
                    <rect x="205" y="357" width="90" height="4" rx="2" fill="#bae6fd" opacity="0.5"/>

                    <!-- 数据流线 - 从芯片到服务器 -->
                    <line x1="250" y1="200" x2="250" y2="270" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.25">
                        <animate attributeName="stroke-dashoffset" values="0;-6" dur="1s" repeatCount="indefinite"/>
                    </line>

                    <!-- 左侧小服务器 -->
                    <rect x="80" y="310" width="50" height="40" rx="4" fill="url(#serverGrad)" opacity="0.6"/>
                    <rect x="85" y="315" width="40" height="8" rx="2" fill="#e0f2fe" opacity="0.6"/>
                    <circle cx="119" cy="319" r="1.5" fill="#0ea5e9" opacity="0.5">
                        <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.5s" repeatCount="indefinite"/>
                    </circle>
                    <rect x="85" y="327" width="40" height="8" rx="2" fill="#e0f2fe" opacity="0.6"/>
                    <circle cx="119" cy="331" r="1.5" fill="#7dd3fc" opacity="0.5">
                        <animate attributeName="opacity" values="0.5;0.2;0.5" dur="1.8s" repeatCount="indefinite"/>
                    </circle>
                    <rect x="83" y="348" width="44" height="3" rx="1.5" fill="#bae6fd" opacity="0.4"/>

                    <!-- 右侧小服务器 -->
                    <rect x="370" y="310" width="50" height="40" rx="4" fill="url(#serverGrad)" opacity="0.6"/>
                    <rect x="375" y="315" width="40" height="8" rx="2" fill="#e0f2fe" opacity="0.6"/>
                    <circle cx="409" cy="319" r="1.5" fill="#0ea5e9" opacity="0.5">
                        <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.2s" repeatCount="indefinite"/>
                    </circle>
                    <rect x="375" y="327" width="40" height="8" rx="2" fill="#e0f2fe" opacity="0.6"/>
                    <circle cx="409" cy="331" r="1.5" fill="#38bdf8" opacity="0.5">
                        <animate attributeName="opacity" values="0.5;0.2;0.5" dur="1.6s" repeatCount="indefinite"/>
                    </circle>
                    <rect x="373" y="348" width="44" height="3" rx="1.5" fill="#bae6fd" opacity="0.4"/>

                    <!-- 连接线 - 小服务器到主服务器 -->
                    <line x1="128" y1="330" x2="195" y2="320" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" opacity="0.15">
                        <animate attributeName="stroke-dashoffset" values="0;-6" dur="1.5s" repeatCount="indefinite"/>
                    </line>
                    <line x1="372" y1="330" x2="305" y2="320" stroke="#7dd3fc" stroke-width="1" stroke-dasharray="3 3" opacity="0.15">
                        <animate attributeName="stroke-dashoffset" values="0;-6" dur="1.5s" repeatCount="indefinite"/>
                    </line>

                    <!-- 屏幕光晕 -->
                    <ellipse cx="250" cy="320" rx="80" ry="40" fill="#0ea5e9" opacity="0.02"/>
                </svg>
            </div>

        </div>
    </div>

    <!-- 右侧：表单卡片 -->
    <div class="auth-split-right">
        <div class="auth-form-card auth-anim auth-anim-3">

            <div class="auth-form-header auth-anim auth-anim-1">
                <div class="auth-form-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <div class="auth-form-brand">
                    <div class="auth-form-title">OSAdmin</div>
                    <div class="auth-form-subtitle">后台管理系统</div>
                </div>
            </div>

            <form id="loginForm" autocomplete="off" style="margin-top:24px;">

                <!-- 邮箱 -->
                <div class="auth-input-group auth-anim auth-anim-2" id="emailGroup" style="margin-bottom:16px;">
                    <label for="email">邮箱地址</label>
                    <div class="auth-input-wrapper">
                        <span class="auth-input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 4L12 13 2 4"/></svg>
                        </span>
                        <input type="email" id="email" placeholder="请输入邮箱地址" autocomplete="off">
                    </div>
                    <div class="auth-input-error" id="emailError">请输入有效的邮箱地址</div>
                </div>

                <!-- 密码 -->
                <div class="auth-input-group auth-anim auth-anim-3" id="pwdGroup" style="margin-bottom:16px;">
                    <label for="password">密码</label>
                    <div class="auth-input-wrapper">
                        <span class="auth-input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                        </span>
                        <input type="password" id="password" placeholder="请输入密码" autocomplete="off">
                        <button type="button" class="auth-input-action" id="togglePwdBtn" aria-label="切换密码可见性">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <div class="auth-input-error" id="pwdError">请输入密码</div>
                </div>

                <!-- 验证码 -->
                <div class="auth-captcha-row auth-anim auth-anim-4" style="margin-bottom:16px;">
                    <div class="auth-input-group" id="captchaGroup">
                        <label for="captcha">验证码</label>
                        <div class="auth-input-wrapper">
                            <span class="auth-input-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                            </span>
                            <input type="text" id="captcha" placeholder="请输入验证码" maxlength="4" autocomplete="off">
                        </div>
                        <div class="auth-input-error" id="captchaError">验证码不正确</div>
                    </div>
                    <canvas class="auth-captcha-canvas" id="captchaCvs" width="120" height="44" title="点击刷新验证码"></canvas>
                </div>

<script>
(function () {
    'use strict';

    /* ===== Canvas 粒子动画（浮动光点，无连线） ===== */
    var cvs = document.getElementById('bgCvs');
    var ctx = cvs.getContext('2d');
    var particles = [];
    var PARTICLE_COUNT = 25;

    function resize() {
        cvs.width = window.innerWidth;
        cvs.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    function createParticle() {
        return {
            x: Math.random() * cvs.width,
            y: Math.random() * cvs.height,
            vx: (Math.random() - 0.5) * 0.4,
            vy: (Math.random() - 0.5) * 0.4,
            r: Math.random() * 3 + 1.5
        };
    }
    for (var i = 0; i < PARTICLE_COUNT; i++) particles.push(createParticle());

    function drawParticles() {
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        var len = particles.length;
        for (var i = 0; i < len; i++) {
            var p = particles[i];
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(14, 165, 233, ' + (0.12 + p.r * 0.06) + ')';
            ctx.fill();
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0 || p.x > cvs.width) p.vx *= -1;
            if (p.y < 0 || p.y > cvs.height) p.vy *= -1;
        }
        requestAnimationFrame(drawParticles);
    }
    drawParticles();

    /* ===== Toast ===== */
    var TB = document.getElementById('TB');
    var toastIcons = {
        success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>',
        error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
        info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
    };

    function toast(type, message) {
        var el = document.createElement('div');
        el.className = 'auth-toast-item ' + type;
        el.innerHTML = '<div class="auth-toast-icon">' + toastIcons[type] + '</div>' +
            '<div class="auth-toast-content">' + message + '</div>';
        TB.appendChild(el);
        setTimeout(function () {
            if (el.parentNode) {
                el.classList.add('auth-toast-out');
                el.addEventListener('animationend', function () { el.remove(); });
            }
        }, 3000);
    }

    /* ===== 密码显隐切换 ===== */
    function togglePassword(id, btn) {
        var input = document.getElementById(id);
        if (input.type === 'password') {
            input.type = 'text';
            btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
        } else {
            input.type = 'password';
            btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        }
    }

    document.getElementById('togglePwdBtn').addEventListener('click', function () {
        togglePassword('password', this);
    });

    /* ===== 输入焦点追踪 ===== */
    document.querySelectorAll('.auth-input-wrapper input').forEach(function (input) {
        var wrapper = input.closest('.auth-input-wrapper');
        input.addEventListener('focus', function () { wrapper.classList.add('auth-focused'); });
        input.addEventListener('blur', function () { wrapper.classList.remove('auth-focused'); });
    });

    /* ===== 按钮涟漪效果 ===== */
    document.querySelectorAll('.auth-btn-primary').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
            var rect = btn.getBoundingClientRect();
            var ripple = document.createElement('span');
            ripple.className = 'auth-ripple';
            var size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
            btn.appendChild(ripple);
            ripple.addEventListener('animationend', function () { ripple.remove(); });
        });
    });

    /* ===== 验证码生成 ===== */
    var captchaCode = '';
    function generateCaptcha() {
        var canvas = document.getElementById('captchaCvs');
        var c = canvas.getContext('2d');
        var w = canvas.width, h = canvas.height;
        var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
        captchaCode = '';
        for (var i = 0; i < 4; i++) captchaCode += chars.charAt(Math.floor(Math.random() * chars.length));

        c.fillStyle = '#f0f9ff';
        c.fillRect(0, 0, w, h);

        c.strokeStyle = 'rgba(14,165,233,.03)';
        c.lineWidth = 0.5;
        for (var x = 0; x < w; x += 8) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke(); }
        for (var y = 0; y < h; y += 8) { c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); }

        for (var i = 0; i < 60; i++) {
            c.fillStyle = 'rgba(' + Math.floor(Math.random() * 200) + ',' + Math.floor(Math.random() * 200) + ',' + Math.floor(Math.random() * 200) + ',.25)';
            c.fillRect(Math.random() * w, Math.random() * h, 2, 2);
        }

        for (var i = 0; i < 3; i++) {
            c.beginPath();
            c.moveTo(Math.random() * w, Math.random() * h);
            c.lineTo(Math.random() * w, Math.random() * h);
            c.strokeStyle = 'rgba(14,165,233,.12)';
            c.lineWidth = 1;
            c.stroke();
        }

        var colors = ['#0ea5e9', '#0284c7', '#38bdf8', '#0369a1'];
        for (var i = 0; i < 4; i++) {
            c.save();
            c.font = (18 + Math.random() * 6) + 'px "Plus Jakarta Sans", sans-serif';
            c.fillStyle = colors[i % colors.length];
            c.translate(18 + i * 25, h / 2 + 6);
            c.rotate((Math.random() - 0.5) * 0.5);
            c.fillText(captchaCode[i], 0, 0);
            c.restore();
        }
    }
    generateCaptcha();
    document.getElementById('captchaCvs').addEventListener('click', generateCaptcha);

    /* ===== 登录处理 ===== */
    var loginForm = document.getElementById('loginForm');
    var loginBtn = document.getElementById('loginBtn');

    function clearError(groupId) {
        document.getElementById(groupId).classList.remove('auth-error');
    }

    loginForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = document.getElementById('email').value.trim();
        var pwd = document.getElementById('password').value;
        var cap = document.getElementById('captcha').value.trim();

        // 清除旧错误
        clearError('emailGroup');
        clearError('pwdGroup');
        clearError('captchaGroup');

        // 逐个验证
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            document.getElementById('emailGroup').classList.add('auth-error');
            toast('error', '请输入有效的邮箱地址');
            return;
        }
        if (!pwd) {
            document.getElementById('pwdGroup').classList.add('auth-error');
            toast('error', '请输入密码');
            return;
        }
        if (!cap || cap.toLowerCase() !== captchaCode.toLowerCase()) {
            document.getElementById('captchaGroup').classList.add('auth-error');
            generateCaptcha();
            toast('error', '验证码不正确');
            return;
        }

        // 模拟登录
        loginBtn.disabled = true;
        loginBtn.innerHTML = '<span class="auth-spinner"></span> 登录中...';

        setTimeout(function () {
            loginBtn.disabled = false;
            loginBtn.textContent = '登录';
            toast('success', '登录成功，正在跳转...');
        }, 1800);
    });

    // 输入时清除错误
    document.getElementById('email').addEventListener('input', function () { clearError('emailGroup'); });
    document.getElementById('password').addEventListener('input', function () { clearError('pwdGroup'); });
    document.getElementById('captcha').addEventListener('input', function () { clearError('captchaGroup'); });

})();
</script>

<!-- 预加载框架核心资源，加速登录后跳转 -->
<script>
(function() {
  var loaded = false;
  function preload() {
    if (loaded) return;
    loaded = true;
    var base = '../../';
    var resources = [
      'lib/layui/css/layui.css',
      'lib/layui/layui.js',
      'admin/css/index.css'
    ];
    resources.forEach(function(path) {
      var link = document.createElement('link');
      link.rel = 'prefetch';
      link.href = base + path;
      document.head.appendChild(link);
    });
  }
  document.addEventListener('focusin', preload, { once: true });
  // 兜底：3秒后自动预加载（用户可能未交互）
  setTimeout(preload, 3000);
})();
</script>
